servers:
  stub:
    connector: stub
    args:
    - serve
    - stub
    env: []
    trust: untrusted
    lazy: true
    timeout: 30
    enabled_by_default: true
    required_env: []
  kev:
    connector: cisa-kev
    args:
    - serve
    - cisa-kev
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  epss:
    connector: first-epss
    args:
    - serve
    - first-epss
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  ism:
    connector: asd-ism
    args:
    - serve
    - asd-ism
    env:
    - GITHUB_TOKEN=${GITHUB_TOKEN}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  asd:
    connector: asd-acsc
    args:
    - serve
    - asd-acsc
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  nvd:
    connector: nvd
    args:
    - serve
    - nvd
    env:
    - NVD_API_KEY=${NVD_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env:
    - NVD_API_KEY
  misp:
    connector: misp
    args:
    - serve
    - misp
    env:
    - MISP_URL=${MISP_URL}
    - MISP_API_KEY=${MISP_API_KEY}
    tools:
      include:
      - search_attributes
      - get_event
      - search_events
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    default_enabled: false
    required_env:
    - MISP_URL
    - MISP_API_KEY
    wrap: true
    upstream:
      repository: https://github.com/MISP/misp-mcp
      commit: 3d033828a78b6b3cb2292b255c8d2ad093c1bee5
      launcher: misp-mcp
      vendored: false
