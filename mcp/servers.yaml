servers:
  stub:
    connector: stub
    args:
    - serve
    - stub
    env: []
    trust: untrusted
    lazy: true
    timeout: 30
    enabled_by_default: true
    required_env: []
  kev:
    connector: cisa-kev
    args:
    - serve
    - cisa-kev
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  epss:
    connector: first-epss
    args:
    - serve
    - first-epss
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  ism:
    connector: asd-ism
    args:
    - serve
    - asd-ism
    env:
    - GITHUB_TOKEN=${GITHUB_TOKEN}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  asd:
    connector: asd-acsc
    args:
    - serve
    - asd-acsc
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  nvd:
    connector: nvd
    args:
    - serve
    - nvd
    env:
    - NVD_API_KEY=${NVD_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env:
    - NVD_API_KEY
  hindsight:
    connector: hindsight
    args:
    - serve
    - hindsight
    env:
    - HINDSIGHT_BASE_URL=${HINDSIGHT_BASE_URL}
    - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY}
    - HINDSIGHT_READ_ONLY=${HINDSIGHT_READ_ONLY}
    - CYBERAU_PROFILE_ROLE=${CYBERAU_PROFILE_ROLE}
    - CYBERAU_DATA_DIR=${CYBERAU_DATA_DIR}
    trust: untrusted
    lazy: true
    timeout: 30
    enabled_by_default: false
    required_env:
    - HINDSIGHT_BASE_URL
