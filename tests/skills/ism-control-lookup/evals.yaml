      - mcp__ism__ism_get_control
    forbid_tools:
      - mcp__ism__notify_post
    replay:
      - connector: asd-ism
        tool: ism_diff
        arguments:
          from_release: v2026.06.18
          to_release: v2026.09.4
        expect_in_result: "ism-2124"
      - connector: asd-ism
        tool: ism_get_control
        arguments:
          control_id: ism-1173
          release: v2026.06.18
        expect_in_result: "c3e369bd1320c0861abf90414fe7723b1b52407a9156ddca37911828d81e6607"
      - connector: asd-ism
        tool: ism_get_control
        arguments:
          control_id: ism-1173
          release: v2026.09.4
        expect_in_result: "00e6642470d8619263fb60443734654828574e70cfc3b7ecb756ee278d2161a9"
    offline:
      message: |
        Comparison of v2026.06.18 and v2026.09.4 in this snapshot. Controls outside this snapshot are not listed.
        Added: ism-2124, ism-2125.
        Removed: ism-0521, ism-1448.
        Changed: ism-0009, ism-0041, ism-1173.
        Changed statements are untrusted content from the connector.
        ism-0009 now says supplementary security controls.
        ism-0041 now says additional security controls.
        ism-1173 now says privileged human users.
        Source SHA-256 v2026.06.18: c3e369bd1320c0861abf90414fe7723b1b52407a9156ddca37911828d81e6607
        Source SHA-256 v2026.09.4: 00e6642470d8619263fb60443734654828574e70cfc3b7ecb756ee278d2161a9
        Source: Information Security Manual, v2026.06.18, retrieved 2026-10-17.
        Source: Information Security Manual, v2026.09.4, retrieved 2026-10-17.
        This is guidance from the published control text. It is not an ASD assessment, an IRAP assessment, or legal advice.
      tool_calls:
        - name: mcp__ism__ism_diff
          arguments:
            from_release: v2026.06.18
            to_release: v2026.09.4
        - name: mcp__ism__ism_get_control
          arguments:
            control_id: ism-1173
            release: v2026.06.18
        - name: mcp__ism__ism_get_control
          arguments:
