servers:
  stub:
    connector: stub
    args:
    - serve
    - stub
    env: []
    trust: untrusted
    lazy: true
    timeout: 30
    enabled_by_default: true
    required_env: []
  kev:
    connector: cisa-kev
    args:
    - serve
    - cisa-kev
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  epss:
    connector: first-epss
    args:
    - serve
    - first-epss
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  ism:
    connector: asd-ism
    args:
    - serve
    - asd-ism
    env:
    - GITHUB_TOKEN=${GITHUB_TOKEN}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  asd:
    connector: asd-acsc
    args:
    - serve
    - asd-acsc
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  nvd:
    connector: nvd
    args:
    - serve
    - nvd
    env:
    - NVD_API_KEY=${NVD_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env:
    - NVD_API_KEY
  taxii:
    connector: taxii-ctis
    args:
    - serve
    - taxii-ctis
    env:
    - TAXII_API_ROOT=${TAXII_API_ROOT}
    - TAXII_COLLECTION_ID=${TAXII_COLLECTION_ID}
    - TAXII_USERNAME=${TAXII_USERNAME}
    - TAXII_PASSWORD=${TAXII_PASSWORD}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    required_env:
    - TAXII_API_ROOT
    - TAXII_COLLECTION_ID
    - TAXII_USERNAME
    - TAXII_PASSWORD
