  - id: scanner-csv-500
    input: "Rank the Nessus CSV at tests/skills/vuln-prioritisation/fixtures/nessus-500.csv. Default asset class is other. The target Essential Eight maturity level is 1."
    required_facts:
      - "500"
      - "5 batches"
      - "100"
      - "CVE-2099-5000"
      - "Tier 3"
      - "residual"
      - "patch-by not set"
      - "Essential Eight connector unavailable"
      - "missing sources"
      - "Proposal:"
