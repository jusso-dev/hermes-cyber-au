servers:
  stub:
    connector: stub
    args:
    - serve
    - stub
    env: []
    trust: untrusted
    lazy: true
    timeout: 30
    enabled_by_default: true
    required_env: []
  kev:
    connector: cisa-kev
    args:
    - serve
    - cisa-kev
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  epss:
    connector: first-epss
    args:
    - serve
    - first-epss
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  ism:
    connector: asd-ism
    args:
    - serve
    - asd-ism
    env:
    - GITHUB_TOKEN=${GITHUB_TOKEN}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  asd:
    connector: asd-acsc
    args:
    - serve
    - asd-acsc
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  nvd:
    connector: nvd
    args:
    - serve
    - nvd
    env:
    - NVD_API_KEY=${NVD_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env:
    - NVD_API_KEY
  virustotal:
    wrap: true
    command: <PROFILE_HOME>/mcp/vendor/virustotal-mcp/bin/vt-mcp
    lock: vendor/virustotal-mcp.lock
    args: []
    env:
    - VTAI_TOKEN=${VTAI_TOKEN}
    tools:
      include:
      - get_file_report
      - get_url_report
      - get_domain_report
      - get_ip_report
    expected_tools: virustotal/expected_tools.txt
    rate_limit:
      per_minute: 4
      per_day: 500
    cache_ttl_hours: 24
    trust: untrusted
    lazy: true
    timeout: 60
    enabled_by_default: false
    disabled_reason: licence terms
    docs: docs/connectors/virustotal.md
    required_env:
    - VTAI_TOKEN
