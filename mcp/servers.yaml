    args:
    - serve
    - asd-blueprint
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  datagov:
    connector: datagov-au
    args:
    - serve
    - datagov-au
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  abusech:
    connector: abusech
    args:
    - serve
    - abusech
    env:
    - ABUSECH_AUTH_KEY=${ABUSECH_AUTH_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    default_enabled: false
    off_reason: licence terms
    terms_doc: docs/connectors/abusech.md
    required_env:
    - ABUSECH_AUTH_KEY
  abuseipdb:
    connector: abuseipdb
    args:
    - serve
    - abuseipdb
    env:
    - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env:
    - ABUSEIPDB_API_KEY
  otx:
    connector: otx
    args:
    - serve
    - otx
    env:
    - OTX_API_KEY=${OTX_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env:
    - OTX_API_KEY
  aureg:
    connector: au-regulatory
    args:
    - serve
    - au-regulatory
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  auscert:
    connector: auscert
    args:
    - serve
    - auscert
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  cloudflare_radar:
    connector: cloudflare-radar
    kind: wrap
    url: https://mcp.cloudflare.com/mcp?codemode=false
    auth: oauth
    token_env: CLOUDFLARE_RADAR_API_TOKEN
    tools:
      include:
      - '*_radar_*'
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    required_env: []
    docs: docs/connectors/cloudflare-radar.md
  cfscan:
    connector: cloudflare-urlscanner
    args:
    - serve
    - cloudflare-urlscanner
    env:
    - CLOUDFLARE_URLSCAN_API_TOKEN=${CLOUDFLARE_URLSCAN_API_TOKEN}
    - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
    trust: untrusted
    lazy: true
    timeout: 120
    supports_parallel_tool_calls: true
    enabled_by_default: false
    default_enabled: false
    required_env:
    - CLOUDFLARE_URLSCAN_API_TOKEN
    - CLOUDFLARE_ACCOUNT_ID
  crtsh:
    connector: crtsh
    args:
    - serve
    - crtsh
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  ghsa:
    connector: github-advisories
    wrap: true
    command: <PROFILE_HOME>/mcp/vendor/github-mcp-server/github-mcp-server
    args:
    - stdio
    - --toolsets
    - security_advisories
    - --read-only
    - --exclude-tools
    - list_repository_security_advisories,list_org_repository_security_advisories
    env:
    - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_ADVISORY_TOKEN}
    tools:
      include:
      - get_global_security_advisory
      - list_global_security_advisories
    trust: untrusted
    lazy: true
    timeout: 60
    enabled_by_default: true
    required_env:
    - GITHUB_ADVISORY_TOKEN
  greynoise:
    connector: greynoise
    args:
    - serve
    - greynoise
    env:
    - GREYNOISE_API_KEY=${GREYNOISE_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  hibp:
    connector: hibp
    args:
    - serve
    - hibp
    env:
    - HIBP_API_KEY=${HIBP_API_KEY}
    - CYBERAU_APPROVAL_KEY=${CYBERAU_APPROVAL_KEY}
    trust: untrusted
    lazy: true
    timeout: 60
    enabled_by_default: true
    required_env: []
    wrap:
      upstream: https://haveibeenpwned.com/mcp
      tools:
        include:
        - hibp_list_breaches
        - hibp_get_breach
        - hibp_get_pwned_passwords_range
        - hibp_get_breached_account
        - hibp_get_breached_domain
        approval:
        - hibp_get_breached_account
        - hibp_get_breached_domain
      auth:
        header: Authorization
        scheme: Bearer
        env: HIBP_API_KEY
      store_results: false
  irap:
    connector: irap
    args:
    - serve
    - irap
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  junction:
    command: "${JUNCTION_BIN}"
    args:
    - mcp
    - serve
    - --policy
    - read-only
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    required_env: []
    tools:
      include:
      - junction_search
      - junction_describe
      - junction_execute
  misp:
    connector: misp
    args:
    - serve
    - misp
    env:
    - MISP_URL=${MISP_URL}
    - MISP_API_KEY=${MISP_API_KEY}
    tools:
      include:
      - search_attributes
      - get_event
      - search_events
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    default_enabled: false
    required_env:
    - MISP_URL
    - MISP_API_KEY
    wrap: true
    upstream:
      repository: https://github.com/MISP/misp-mcp
      commit: 3d033828a78b6b3cb2292b255c8d2ad093c1bee5
      launcher: misp-mcp
      vendored: false
  ncscnz:
    connector: ncsc-nz
    args:
    - serve
    - ncsc-nz
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  opencti:
    connector: opencti
    args:
    - serve
    - opencti
    env:
    - OPENCTI_URL=${OPENCTI_URL}
    - OPENCTI_TOKEN=${OPENCTI_TOKEN}
