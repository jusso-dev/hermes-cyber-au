skill: pspf-risk-assessment
cases:
- id: payroll-system
  input: 'Example Agency is synthetic. Do a threat and risk assessment and draft the SRMP for the payroll
    web application APP-DEMO-07 in examples/assets.csv. It holds OFFICIAL: Sensitive payroll records and
    staff bank details. The Secretary set our risk tolerance at medium on 2026-07-01. The National Terrorism
    Threat Level is PROBABLE. The CISO stewards cyber risks. Bank detail changes need one approver only.
    We have no risk matrix of our own. Our incident plan is the Example Agency cyber incident response
    plan v3. Do not send it anywhere.'
  required_facts:
  - '# Threat and risk assessment: Payroll web application APP-DEMO-07'
  - '# Security risk management plan: Payroll web application APP-DEMO-07'
  - give extreme
  - '| R1 | extreme | medium | within tolerance |'
  - hermes-cyber-au default 5 by 5 matrix
  - Replace it with the entity's matrix before approval.
  - proposed, for the risk steward to confirm
  - 'Risk steward: missing. PSPF Requirement 0037:'
  - 'R2: threat T2 has no sourced evidence.'
  - 'Proposal: Upgrade Log4j on APP-DEMO-07 to a fixed release.'
  - 'Proposal: the Authorising Officer reviews and approves this plan.'
  - formally review it by 2028-10-19
  - 'Source missing: ASD ACSC advisories (mcp__asd__asd_search).'
  - not an IRAP assessment
  - Nothing was sent and no one was notified.
  - 'Source: CISA Known Exploited Vulnerabilities, skill-fixture-1, retrieved '
  - 'Source: asd-ism, v2026.09.4, retrieved '
  - 'Source: PSPF Release 2026 List of Requirements, July 2026, retrieved '
  forbidden_claims:
  - accepted by
  - Approved by
  - is authorised to operate
  - ASD assessed
  expect_tools:
  - mcp__kev__kev_lookup
  - mcp__ism__ism_get_control
  - mcp__asd__asd_search
  forbid_tools:
  - mcp__notify__notify_send
  - mcp__briefing__briefing_send
  - mcp__pspf__pspf_submit
  replay:
  - connector: cisa-kev
    tool: kev_lookup
    arguments:
      cve_ids:
      - CVE-2021-44228
    env:
      CYBERAU_KEV_SNAPSHOT: fixtures/kev.json
    expect_in_result: Synthetic KEV row for risk assessment tests
  - connector: asd-ism
    tool: ism_get_control
    arguments:
      control_id: ISM-1876
    expect_in_result: applied within 48 hours of release when vulnerabilities are assessed as critical
      by vendors or when working exploits exist
  offline:
    message: |
      # Threat and risk assessment: Payroll web application APP-DEMO-07

      This is a draft prepared with hermes-cyber-au from the information supplied and the sources cited. It is not an IRAP assessment, not an authorisation to operate, not a PSPF compliance finding and not legal advice. Each rating is for the risk steward to confirm. Nothing was sent and no one was notified.

      ## Scope and context

      Entity: Example Agency (synthetic)
      Subject: Payroll web application APP-DEMO-07 (system)
      Highest classification handled: OFFICIAL: Sensitive
      Residual risk decision: Authorising Officer
      As of: 2026-10-19
      Objectives: Pay staff accurately and on time; Protect staff personal and bank details
      Out of scope: Corporate desktop fleet

      Method: PSPF security risk management process (5.2). Security risk assessment identifies, analyses and evaluates security risks. Treatment is drafted in the security risk management plan.
      Source: PSPF Release 2026, July 2026, retrieved 2026-10-19

      ## Critical assets

      | id | asset | type | classification | critical | owner |
      | --- | --- | --- | --- | --- | --- |
      | A1 | Payroll records and staff bank details | information | OFFICIAL: Sensitive | yes | Chief Financial Officer |
      | A2 | APP-DEMO-07 payroll web application | system | OFFICIAL: Sensitive | yes | Payroll application owner |

      ## Threat assessment

      National Terrorism Threat Level: PROBABLE
      Source: supplied context, none, retrieved 2026-10-19
      ASIO reporting on espionage, foreign interference or sabotage: missing

      ### T1: Financially motivated cybercriminals exploiting internet-facing applications

      Actor type: external
      Capability: high
      Intent: financial gain, including ransomware
      ATT&CK techniques: T1190
      - CVE-2021-44228 is listed in the KEV fixture with known ransomware campaign use.
        Source: CISA Known Exploited Vulnerabilities, skill-fixture-1, retrieved 2026-10-19
      - APP-DEMO-07 runs Apache Log4j 2.14.1 and is internet-facing.
        Source: supplied asset list examples/assets.csv, none, retrieved 2026-10-19

      ### T2: Trusted insider misusing payroll access

      Actor type: insider
      Capability: medium
      Intent: financial gain
      Evidence: none sourced. This threat is an assessor assumption and needs a source before the plan is approved.

      ## Risk analysis

      Risk matrix: hermes-cyber-au default 5 by 5 matrix.
      The entity's own risk matrix was not supplied. Ratings use the default matrix: likelihood and consequence are scored 1 to 5 and multiplied; 1 to 3 is low, 4 to 9 medium, 10 to 15 high and 16 to 25 extreme. Replace it with the entity's matrix before approval.
      Likelihood: rare, unlikely, possible, likely, almost certain.
      Consequence: insignificant, minor, moderate, major, severe.

      | id | risk | likelihood | consequence | inherent | rated by | steward |
      | --- | --- | --- | --- | --- | --- | --- |
      | R1 | Cybercriminals exploit the unpatched Log4j library in APP-DEMO-07 to run code, steal staff bank details and disrupt pay runs | likely | major | extreme | proposed, for the risk steward to confirm | Chief Information Security Officer |
      | R2 | A payroll officer changes bank details to divert pay | possible | moderate | medium | proposed, for the risk steward to confirm | missing |

      ### R1: Cybercriminals exploit the unpatched Log4j library in APP-DEMO-07 to run code, steal staff bank details and disrupt pay runs

      Assets: A1, A2
      Threats: T1
      Vulnerability: Apache Log4j 2.14.1 on an internet-facing host
      - Control: Patches for online services are applied within 48 hours when working exploits exist (ism-1876).
        Effectiveness: not in place for APP-DEMO-07.
        Source: asd-ism, v2026.09.4, retrieved 2026-10-19
      Rationale: A known exploited vulnerability with ransomware use is present on an internet-facing host that holds critical personal information.
      Inherent risk: likely likelihood and major consequence give extreme.
      Rated by: proposed, for the risk steward to confirm
      Risk steward: Chief Information Security Officer

      ### R2: A payroll officer changes bank details to divert pay

      Assets: A1
      Threats: T2
      Vulnerability: No second approval for bank detail changes
      Existing controls: none recorded.
      Rationale: Supplied context says changes need one approver only.
      Inherent risk: possible likelihood and moderate consequence give medium.
      Rated by: proposed, for the risk steward to confirm
      Risk steward: missing. PSPF Requirement 0037: A risk steward (or manager) is identified for each security risk or category of security risk, including shared risks.

      ## Risk evaluation

      Risk tolerance: residual risk rated medium or lower is within tolerance. Determined by Secretary of Example Agency on 2026-07-01.

      | id | inherent | residual | against tolerance |
      | --- | --- | --- | --- |
      | R1 | extreme | medium | within tolerance |
      | R2 | medium | medium | within tolerance |

      ## Gaps

      1. Source missing: ASD ACSC advisories (mcp__asd__asd_search). Nothing from it was assumed.
      2. Source missing: ATT&CK (mcp__attack__attack_search). Nothing from it was assumed.
      3. R2: risk steward missing (PSPF Requirement 0037).
      4. R2: threat T2 has no sourced evidence.

      Source: PSPF Release 2026 List of Requirements, July 2026, retrieved 2026-10-19
      Source: PSPF Release 2026, July 2026, retrieved 2026-10-19

      # Security risk management plan: Payroll web application APP-DEMO-07

      This is a draft prepared with hermes-cyber-au from the information supplied and the sources cited. It is not an IRAP assessment, not an authorisation to operate, not a PSPF compliance finding and not legal advice. Each rating is for the risk steward to confirm. Nothing was sent and no one was notified.

      Plan type: System security risk management plan.

      Entity: Example Agency (synthetic)
      Subject: Payroll web application APP-DEMO-07 (system)
      Highest classification handled: OFFICIAL: Sensitive
      Residual risk decision: Authorising Officer
      As of: 2026-10-19
      Objectives: Pay staff accurately and on time; Protect staff personal and bank details
      Out of scope: Corporate desktop fleet

      ## PSPF security plan elements

      The mandatory elements apply to the entity security plan (PSPF Requirement 0018). For this plan they are a completeness check.

      | element | status | detail |
      | --- | --- | --- |
      | Security goals and objectives | drafted | Keep payroll available and staff data confidential |
      | Security risk environment | drafted | 2 threats and 2 risks in this plan |
      | Risk tolerance | drafted | residual medium or lower |
      | Security capability | missing | not supplied |
      | Security risk management strategies | partial | no treatment for R2 |
      | Implications of risk decisions | missing | not supplied |
      | PSPF implementation | missing | not supplied |
      | PSPF Directions | missing | not supplied |
      | Critical people and resources | drafted | Payroll records and staff bank details, APP-DEMO-07 payroll web application |
      | Threat levels | drafted | National Terrorism Threat Level PROBABLE |
      | Incident management plan | drafted | Example Agency cyber incident response plan v3 |
      | Monitoring and improvement | missing | not supplied |
      | Review | drafted | schedule in Monitoring and review |

      Source: PSPF Release 2026, July 2026, retrieved 2026-10-19

      ## Risk tolerance

      Risk tolerance: residual risk rated medium or lower is within tolerance. Determined by Secretary of Example Agency on 2026-07-01.

      ## Risk treatment plan

      | id | steward | inherent | treatment | residual | against tolerance | acceptance |
      | --- | --- | --- | --- | --- | --- | --- |
      | R1 | Chief Information Security Officer | extreme | reduce | medium | within tolerance | not recorded |
      | R2 | missing | medium | missing | medium | within tolerance | not recorded |

      ### R1: Cybercriminals exploit the unpatched Log4j library in APP-DEMO-07 to run code, steal staff bank details and disrupt pay runs

      Treatment option: Reduce (treat)
      Proposal: Upgrade Log4j on APP-DEMO-07 to a fixed release. Owner: Payroll application owner. Due: 2026-10-21.
        ISM controls: ism-1876
      Proposal: Hunt for exploitation of CVE-2021-44228 on APP-DEMO-07 since it was exposed. Owner: Security operations lead. Due: 2026-10-24.
      Residual risk: unlikely likelihood and major consequence give medium (target residual after the proposed treatment).
      Against tolerance: within tolerance.
      Proposal: the Authorising Officer records acceptance of this residual risk once the treatment is in place. Reversible by recording a new decision.

      ### R2: A payroll officer changes bank details to divert pay

      Treatment option: missing
      Residual risk: possible likelihood and moderate consequence give medium (residual not assessed, so the inherent rating is carried).
      Against tolerance: within tolerance.
      Proposal: the Authorising Officer records acceptance of this residual risk. Reversible by recording a new decision.

      ## Monitoring and review

      Consider this plan by 2027-10-19 and formally review it by 2028-10-19, counted from this draft (not yet approved) on 2026-10-19.
      PSPF Requirement 0020: The security plan is considered annually and reviewed at least every two years to confirm its adequacy and ability to adapt to shifts in the entity's risk, threat or operating environment.
      Review earlier when the National Terrorism Threat Level changes, a new threat changes a business impact level, or the subject changes significantly.
      Source: PSPF Release 2026 List of Requirements, July 2026, retrieved 2026-10-19

      ## Approval

      Not approved. Proposal: the Authorising Officer reviews and approves this plan. Reversible by withdrawing the draft.
      PSPF Requirement 0086: The Authorising Officer authorises each technology system to operate based on the acceptance of the residual security risks associated with its operation before that system processes, stores or communicates government information or data.

      ## Gaps

      1. Source missing: ASD ACSC advisories (mcp__asd__asd_search). Nothing from it was assumed.
      2. Source missing: ATT&CK (mcp__attack__attack_search). Nothing from it was assumed.
      3. R2: risk steward missing (PSPF Requirement 0037).
      4. R2: threat T2 has no sourced evidence.

      Source: PSPF Release 2026 List of Requirements, July 2026, retrieved 2026-10-19
      Source: PSPF Release 2026, July 2026, retrieved 2026-10-19
    tool_calls:
    - name: mcp__kev__kev_lookup
      arguments:
        cve_ids:
        - CVE-2021-44228
    - name: mcp__asd__asd_search
      arguments:
        query: Log4j
    - name: mcp__attack__attack_search
      arguments:
        query: exploit public-facing application
    - name: mcp__ism__ism_get_control
      arguments:
        control_id: ISM-1876
- id: entity-no-tolerance
  input: Example Regulator is synthetic. Draft the risk part of our entity security plan. Our CSO rates
    foreign intelligence cultivation of staff as possible likelihood and severe consequence. We have not
    set a risk tolerance yet.
  required_facts:
  - '# Security risk management plan: Example Regulator security plan risk component'
  - 'Risk tolerance: missing. No tolerance was assumed'
  - not evaluated (tolerance missing)
  - 'PSPF Requirement 0036:'
  - 'PSPF Requirement 0019:'
  - 'Proposal: the Accountable Authority reviews and approves this plan.'
  - '| Threat levels | missing | National Terrorism Threat Level not supplied |'
  - 'Source: PSPF Release 2026, July 2026, retrieved '
  forbidden_claims:
  - within tolerance
  - above tolerance
  - accepted by
  - acceptable level
  forbid_tools:
  - mcp__notify__notify_send
  - mcp__pspf__pspf_submit
