  - id: june-september-2026
    input: "What changed between the June 2026 and September 2026 ISM releases?"
    required_facts:
      - "in this snapshot"
      - "Added"
      - "Removed"
      - "Changed"
      - "ism-2124"
      - "ism-2125"
      - "ism-0521"
      - "ism-1448"
      - "ism-0009"
      - "ism-0041"
      - "ism-1173"
