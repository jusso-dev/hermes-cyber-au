    message: "This is guidance, not legal advice. Nothing has been submitted, sent or lodged. A person\
      \ decides and reports. Check each source before relying on it.\n\nDiscovered: 2026-10-02T09:00:00+10:00\
      \ (Australia/Sydney)\nCountdown as at: 2026-10-04T09:00:00+11:00\n\nTimeline (soonest first):\n\
      - 2026-10-06T13:00:00+11:00 (2d 4h 00m left): Ransomware payment report, report [applies]\n- 2026-11-01T09:00:00+11:00\
      \ (28d 0h 00m left): Notifiable Data Breaches: assess a suspected eligible data breach, assessment\
      \ [applies]\n- as soon as practicable: Voluntary report to ASD's ACSC (ReportCyber), report [applies]\n\
      - as soon as practicable: Notifiable Data Breaches: statement to the Commissioner and notice to\
      \ individuals, commissioner_statement [may apply]\n- as soon as practicable: Notifiable Data Breaches:\
      \ statement to the Commissioner and notice to individuals, individual_notice [may apply]\n\nApplies:\n\
      - Notifiable Data Breaches: assess a suspected eligible data breach (mandatory)\n  Recipient: No\
      \ external recipient. This is an internal assessment duty.\n  Channel: Internal assessment record.\n\
      \  Deadline assessment: 30 days from discovery, due 2026-11-01T09:00:00+11:00\n    Basis: All reasonable\
      \ steps to complete the assessment within 30 days after awareness (Privacy Act 1988 (Cth) s 26WH(2)).\n\
      \  Citation: Privacy Act 1988 (Cth) s 26WH(2). Link: https://www.legislation.gov.au/C2004A03712/latest/text\n\
      \  Source: Notifiable Data Breaches: assess a suspected eligible data breach, aureg snapshot 2026-11-28,\
      \ retrieved 2026-11-28\n  DRAFT. Not submitted. Draft fields:\n    What happened and when: Ransomware\
      \ encrypted file servers and a payment was made\n    Kinds of personal information involved: (to\
      \ complete)\n    Number of individuals affected, or an estimate: (to complete)\n    Likelihood of\
      \ serious harm and why: (to complete)\n    Remedial action taken to reduce the risk of harm: (to\
      \ complete)\n- Ransomware payment report (mandatory)\n  Recipient: The designated Commonwealth body\
      \ (Cyber Security Act 2024 s 8): the Department of Home Affairs and ASD unless rules name another\
      \ body.\n  Channel: ASD ransomware and cyber extortion payment reporting form. A person lodges it.\n\
      \  Deadline report: 72 hours from payment, due 2026-10-06T13:00:00+11:00\n    Basis: Within 72 hours\
      \ of making the ransomware payment or of becoming aware that it was made, whichever applies (Cyber\
      \ Security Act 2024 (Cth) s 27(1)).\n  Citation: Cyber Security Act 2024 (Cth) s 27(1). Link: https://www.legislation.gov.au/C2024A00098/latest/text\n\
      \  Source: Ransomware payment report, aureg snapshot 2026-11-28, retrieved 2026-11-28\n  DRAFT.\
      \ Not submitted. Draft fields:\n    Reporting entity ABN (if any) and address: Example Retail Pty\
