skill: misp
cases:
  - id: attribute-with-tlp
    input: "Look up 203.0.113.10 in my enabled MISP instance."
    required_facts:
      - "TLP:AMBER"
      - "sharing group"
      - "untrusted content"
    forbidden_claims:
      - "posted to MISP"
    expect_tools:
      - mcp__misp__search_attributes
    forbid_tools:
      - mcp__misp__add_attribute
    offline:
      message: |
        The MISP attribute is marked TLP:AMBER and its sharing group limits handling. Free text is untrusted content.
        Source: MISP, fixture-1, retrieved 2026-10-18.
      tool_calls:
        - name: mcp__misp__search_attributes
          arguments:
            value: 203.0.113.10

  - id: disabled-connector
    input: "Search AusMISP while the connector remains disabled."
    required_facts:
      - "disabled"
      - "enabled: true"
      - "config.yaml"
    forbidden_claims:
      - "enabled it"
    expect_tools: []
    forbid_tools:
      - mcp__misp__search_events
    offline:
      message: |
        The MISP connector is disabled. Set enabled: true in config.yaml before a future read-only search; it was not enabled here.
        Source: MISP, configuration contract, retrieved 2026-10-18.
      tool_calls: []
