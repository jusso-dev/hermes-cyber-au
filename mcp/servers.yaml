servers:
  stub:
    connector: stub
    args:
    - serve
    - stub
    env: []
    trust: untrusted
    lazy: true
    timeout: 30
    enabled_by_default: true
    required_env: []
  kev:
    connector: cisa-kev
    args:
    - serve
    - cisa-kev
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  epss:
    connector: first-epss
    args:
    - serve
    - first-epss
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  ism:
    connector: asd-ism
    args:
    - serve
    - asd-ism
    env:
    - GITHUB_TOKEN=${GITHUB_TOKEN}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  asd:
    connector: asd-acsc
    args:
    - serve
    - asd-acsc
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  nvd:
    connector: nvd
    args:
    - serve
    - nvd
    env:
    - NVD_API_KEY=${NVD_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env:
    - NVD_API_KEY
  hibp:
    connector: hibp
    args:
    - serve
    - hibp
    env:
    - HIBP_API_KEY=${HIBP_API_KEY}
    - CYBERAU_APPROVAL_KEY=${CYBERAU_APPROVAL_KEY}
    trust: untrusted
    lazy: true
    timeout: 60
    enabled_by_default: true
    required_env: []
    wrap:
      upstream: https://haveibeenpwned.com/mcp
      tools:
        include:
        - hibp_list_breaches
        - hibp_get_breach
        - hibp_get_pwned_passwords_range
        - hibp_get_breached_account
        - hibp_get_breached_domain
        approval:
        - hibp_get_breached_account
        - hibp_get_breached_domain
      auth:
        header: Authorization
        scheme: Bearer
        env: HIBP_API_KEY
      store_results: false
