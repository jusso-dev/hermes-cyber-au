skill: essentials-assessment
cases:
  - id: mfa-admins-only
    input: |
      Assess Essential Eight maturity for the synthetic Example Tenant.
      Target maturity level 1 for multi_factor_authentication only.
      Evidence E-1: MFA is enabled for administrator accounts only. Ordinary accounts use a password.
    required_facts:
      - "MFA is enabled for administrator accounts only"
      - "Essential Eight requirements source missing"
      - "Status: missing"
      - "was not scored"
      - "Essential Eight maturity: missing"
      - "self-assessment aid"
      - "not an ASD assessment"
      - "Source: Essential Eight requirements, missing, retrieved "
      - "Source: supplied evidence, none, retrieved "
      - "Proposal:"
    forbidden_claims:
      - "status: partial"
      - "maturity level"
      - "requirements are met"
      - "not met"
      - "NIST"
      - "CANARY-REQUIREMENT-TEXT"
    expect_tools:
      - mcp__e8__e8_requirements
    forbid_tools:
      - mcp__e8__essentials_publish
      - evidence_import
    offline:
      message: |
        # Essentials assessment

        This is a self-assessment aid. It is not an ASD assessment and it is not an IRAP assessment. This workbook was not sent and no one was notified.

        Workbook columns: strategy_or_domain,requirement_id,requirement_text,evidence_ref,status,ism_ids,notes

        ## Summary

        | strategy_or_domain | requirement_id | requirement_text | evidence_ref | status | ism_ids |
        | --- | --- | --- | --- | --- | --- |
        | multi_factor_authentication | missing | missing | E-1 | missing | missing |

        Essential Eight maturity: missing

        ## Findings

        ### multi_factor_authentication

        Requirement id: missing
        Requirement text: missing
        Evidence ref: E-1
        Status: missing
        ISM ids: missing
        Essential Eight requirements source missing (mcp__e8__e8_requirements). Supplied evidence was recorded and was not scored.
        Evidence E-1: MFA is enabled for administrator accounts only. Ordinary accounts use a password.
        Source: Essential Eight requirements, missing, retrieved 2026-10-17
        Source: supplied evidence, none, retrieved 2026-10-17

        ## Gaps by priority

        1. Missing sources: Essential Eight requirements (mcp__e8__e8_requirements).
        2. Missing controls: none.
        3. Unknown evidence: none.
        4. Unscored evidence: E-1.

        ## Next 90 days

        Proposal: retrieve the missing sources and the missing evidence, then repeat this self-assessment before changing a control. Reversible by discarding this workbook.
      tool_calls:
        - name: mcp__e8__e8_requirements
          arguments:
            strategy: multi_factor_authentication
            maturity_level: 1

