[project]
name = "cyberau-workspace"
version = "0.1.0"
description = "Workspace for hermes-cyber-au MCP connectors."
requires-python = ">=3.11"
dependencies = ["cyberau-common"]

[tool.uv.workspace]
members = ["common", "cisa-kev", "first-epss", "nvd", "asd-acsc", "asd-ism", "datagov-au", "org-exposure", "abusech", "abuseipdb", "otx", "asd-blueprint", "au-regulatory", "auscert", "cloudflare-urlscanner", "crtsh", "github-advisories", "greynoise"]

[tool.uv.sources]
cyberau-common = { workspace = true }

[dependency-groups]
dev = [
  "hypothesis>=6,<7",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "pytest-recording>=0.13,<0.14",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = [
  "common/tests",
  "../tests",
  "asd-acsc/tests",
  "asd-ism/tests",
  "cisa-kev/tests",
  "first-epss/tests",
  "nvd/tests",
  "cloudflare-radar/tests",
  "datagov-au/tests",
  "org-exposure/tests",
  "abusech/tests",
  "abuseipdb/tests",
  "otx/tests",
  "asd-blueprint/tests",
  "au-regulatory/tests",
  "auscert/tests",
  "cloudflare-urlscanner/tests",
  "crtsh/tests",
  "github-advisories/tests",
  "greynoise/tests",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
source = ["cyberau_common"]
branch = false
