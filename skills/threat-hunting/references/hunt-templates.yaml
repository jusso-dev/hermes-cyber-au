# Hunt query templates for scripts/hunt_queries.py.
#
# Every query built from this file is an untested draft. Nothing here runs a query.
#
# Placeholders, filled only with values that passed validation and escaping:
#   {{lookback}}         the lookback window, for example 30d
#   {{in FIELD}}         FIELD equals any value (KQL in~, SPL OR chain)
#   {{contains FIELD}}   FIELD contains any value (KQL contains, SPL wildcards)
#   {{suffix FIELD}}     FIELD is a value or a subdomain of it
# Sigma detection strings:
#   "{{values}}"                 the value list, Sigma-escaped
#   "{{values prefix=TEXT}}"     each value with TEXT in front
#
# Technique names were read from attack.mitre.org on the retrieved date below.
# Table and column names are checked against references/schemas/ and
# references/splunk-cim.yaml.
attack:
  source_name: MITRE ATT&CK
  version: v20.1
  retrieved: "2026-11-28"
  techniques:
    T1003.001: "OS Credential Dumping: LSASS Memory"
    T1053.005: "Scheduled Task/Job: Scheduled Task"
    T1059.001: "Command and Scripting Interpreter: PowerShell"
    T1105: "Ingress Tool Transfer"
    T1190: "Exploit Public-Facing Application"
    T1505.003: "Server Software Component: Web Shell"

templates:
  - id: ioc-ip
    title: Connections to listed IP addresses
    ioc: ip
    false_positives:
      - Shared hosting and content delivery networks reuse addresses, so a match can be unrelated traffic.
      - An address can change hands after the advisory date. Compare the event time with the advisory window.
    kql_defender:
      data_sources: [DeviceNetworkEvents table (Microsoft Defender for Endpoint)]
      query: |
        DeviceNetworkEvents
        | where Timestamp > ago({{lookback}})
        | where {{in RemoteIP}}
        | project Timestamp, DeviceName, RemoteIP, RemotePort, RemoteUrl, InitiatingProcessFileName, InitiatingProcessCommandLine
    kql_sentinel:
      data_sources: [CommonSecurityLog table (firewalls and proxies that send CEF to Microsoft Sentinel)]
      query: |
        CommonSecurityLog
        | where TimeGenerated > ago({{lookback}})
        | where {{in SourceIP}} or {{in DestinationIP}}
        | project TimeGenerated, DeviceVendor, DeviceProduct, SourceIP, DestinationIP, DestinationPort, DeviceAction
    spl:
      data_sources: [Network_Traffic data model All_Traffic dataset (Splunk CIM 6.2)]
      query: |
        | tstats summariesonly=false count min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Traffic.All_Traffic where ({{in All_Traffic.dest_ip}} OR {{in All_Traffic.src_ip}}) earliest=-{{lookback}} by All_Traffic.src_ip All_Traffic.dest_ip All_Traffic.dest_port All_Traffic.action
    sigma:
      data_sources: [Network connection logs (Sysmon event 3 or an EDR network feed)]
      logsource: {category: network_connection, product: windows}
      detection:
        selection:
          DestinationIp: "{{values}}"
        condition: selection

  - id: ioc-domain
    title: Lookups and connections to listed domains
    ioc: domain
    false_positives:
      - Subdomain matching can catch unrelated hosts under a shared parent domain.
      - Security tools, sandboxes and threat intel platforms look up known bad domains. Exclude those hosts after review.
    kql_defender:
      data_sources: [DeviceNetworkEvents table (Microsoft Defender for Endpoint)]
      query: |
        DeviceNetworkEvents
        | where Timestamp > ago({{lookback}})
        | where {{contains RemoteUrl}}
        | project Timestamp, DeviceName, RemoteIP, RemoteUrl, InitiatingProcessFileName, InitiatingProcessCommandLine
    kql_sentinel:
      data_sources: [CommonSecurityLog table (proxies and firewalls that send CEF to Microsoft Sentinel)]
      query: |
        CommonSecurityLog
        | where TimeGenerated > ago({{lookback}})
        | where {{contains DestinationHostName}} or {{contains RequestURL}}
        | project TimeGenerated, DeviceVendor, DeviceProduct, SourceIP, DestinationHostName, RequestURL, DeviceAction
    spl:
      data_sources: [Network_Resolution data model DNS dataset (Splunk CIM 6.2)]
      query: |
        | tstats summariesonly=false count min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Resolution.DNS where {{suffix DNS.query}} earliest=-{{lookback}} by DNS.src DNS.query DNS.answer
    sigma:
      data_sources: [DNS query logs (Sysmon event 22 or an EDR DNS feed)]
      logsource: {category: dns_query, product: windows}
      detection:
        selection_exact:
          QueryName: "{{values}}"
        selection_subdomain:
          QueryName|endswith: "{{values prefix=.}}"
        condition: 1 of selection_*

  - id: ioc-url
    title: Requests to listed URLs
    ioc: url
    false_positives:
      - HTTPS connections often record only the host name, so a full URL match can miss them. Hunt the host with the domain template as well.
      - Some proxies log the host and the path in separate fields. Split the URL to match how your proxy logs it.
    kql_defender:
      data_sources: [DeviceNetworkEvents table (Microsoft Defender for Endpoint)]
      query: |
        DeviceNetworkEvents
        | where Timestamp > ago({{lookback}})
        | where {{contains RemoteUrl}}
        | project Timestamp, DeviceName, RemoteIP, RemoteUrl, InitiatingProcessFileName, InitiatingProcessCommandLine
    kql_sentinel:
      data_sources: [CommonSecurityLog table (web proxies that send CEF to Microsoft Sentinel)]
      query: |
        CommonSecurityLog
        | where TimeGenerated > ago({{lookback}})
        | where {{contains RequestURL}}
        | project TimeGenerated, DeviceVendor, DeviceProduct, SourceIP, RequestURL, RequestClientApplication, DeviceAction
    spl:
      data_sources: [Web data model Web dataset (Splunk CIM 6.2)]
      query: |
        | tstats summariesonly=false count min(_time) as firstTime max(_time) as lastTime from datamodel=Web.Web where {{contains Web.url}} earliest=-{{lookback}} by Web.src Web.user Web.url Web.http_user_agent Web.status
    sigma:
      data_sources: [Web proxy logs]
      logsource: {category: proxy}
      detection:
        selection:
          c-uri|contains: "{{values}}"
        condition: selection

  - id: ioc-sha256
    title: Files and processes with listed SHA-256 hashes
    ioc: sha256
    false_positives:
      - A hash match is strong evidence for that file, but advisories sometimes list legitimate tools the actor abused. Check the file name and signer.
      - Hash fields in some log sources hold several digests in one string, which is why the Splunk query uses a contains match.
    kql_defender:
      data_sources:
        - DeviceProcessEvents table (Microsoft Defender for Endpoint)
        - DeviceFileEvents table (Microsoft Defender for Endpoint)
      query: |
        union DeviceProcessEvents, DeviceFileEvents
        | where Timestamp > ago({{lookback}})
        | where {{in SHA256}}
        | project Timestamp, DeviceName, ActionType, FileName, FolderPath, SHA256
    kql_sentinel:
      data_sources: [CommonSecurityLog table (security appliances that send file hashes in CEF)]
      query: |
        CommonSecurityLog
        | where TimeGenerated > ago({{lookback}})
        | where {{in FileHash}}
        | project TimeGenerated, DeviceVendor, DeviceProduct, SourceIP, FileName, FileHash, DeviceAction
    spl:
      data_sources: [Endpoint data model Filesystem dataset (Splunk CIM 6.2)]
      query: |
        | tstats summariesonly=false count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Filesystem where {{contains Filesystem.file_hash}} earliest=-{{lookback}} by Filesystem.dest Filesystem.file_name Filesystem.file_path Filesystem.file_hash
    sigma:
      data_sources: [Process creation logs with hashes (Sysmon event 1 with SHA256 hashing on)]
      logsource: {category: process_creation, product: windows}
      detection:
        selection:
          Hashes|contains: "{{values prefix=SHA256=}}"
        condition: selection

  - id: ioc-md5
    title: Files and processes with listed MD5 hashes
    ioc: md5
    false_positives:
      - MD5 collisions are possible. Confirm a match with SHA-256 where the log source has it.
      - Advisories sometimes list legitimate tools the actor abused. Check the file name and signer.
    kql_defender:
      data_sources:
        - DeviceProcessEvents table (Microsoft Defender for Endpoint)
        - DeviceFileEvents table (Microsoft Defender for Endpoint)
      query: |
        union DeviceProcessEvents, DeviceFileEvents
        | where Timestamp > ago({{lookback}})
        | where {{in MD5}}
        | project Timestamp, DeviceName, ActionType, FileName, FolderPath, MD5
    kql_sentinel:
      data_sources: [CommonSecurityLog table (security appliances that send file hashes in CEF)]
      query: |
        CommonSecurityLog
        | where TimeGenerated > ago({{lookback}})
        | where {{in FileHash}}
        | project TimeGenerated, DeviceVendor, DeviceProduct, SourceIP, FileName, FileHash, DeviceAction
    spl:
      data_sources: [Endpoint data model Filesystem dataset (Splunk CIM 6.2)]
      query: |
        | tstats summariesonly=false count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Filesystem where {{contains Filesystem.file_hash}} earliest=-{{lookback}} by Filesystem.dest Filesystem.file_name Filesystem.file_path Filesystem.file_hash
    sigma:
      data_sources: [Process creation logs with hashes (Sysmon event 1 with MD5 hashing on)]
      logsource: {category: process_creation, product: windows}
      detection:
        selection:
          Hashes|contains: "{{values prefix=MD5=}}"
        condition: selection

  - id: ioc-email
    title: Mail from listed sender addresses
    ioc: email
    false_positives:
      - Sender addresses are easy to forge. A match on the From address does not prove who sent the message.
      - Blocked and quarantined messages still appear. Check the delivery action before you treat a match as delivered.
    kql_defender:
      data_sources: [EmailEvents table (Microsoft Defender for Office 365, also streamed to Microsoft Sentinel by the Defender XDR connector)]
      query: |
        EmailEvents
        | where Timestamp > ago({{lookback}})
        | where {{in SenderFromAddress}} or {{in SenderMailFromAddress}}
        | project Timestamp, NetworkMessageId, SenderFromAddress, SenderMailFromAddress, RecipientEmailAddress, Subject, DeliveryAction
    spl:
      data_sources: [Email data model All_Email dataset (Splunk CIM 6.2)]
      query: |
        | tstats summariesonly=false count min(_time) as firstTime max(_time) as lastTime from datamodel=Email.All_Email where {{in All_Email.src_user}} earliest=-{{lookback}} by All_Email.src_user All_Email.recipient All_Email.subject
    sigma_unavailable: The Sigma log source taxonomy has no mail flow category, so no Sigma rule is drafted for sender addresses.
    kql_sentinel_unavailable: Microsoft Sentinel receives EmailEvents through the Defender XDR connector. Use the Defender query there.

  - id: powershell-encoded
    title: PowerShell started with an encoded command
    techniques: [T1059.001]
    false_positives:
      - Management and deployment tools can run encoded PowerShell. Baseline by parent process and account.
      - Short forms such as -e and -ec are not matched, so this can miss activity.
    kql_defender:
      data_sources: [DeviceProcessEvents table (Microsoft Defender for Endpoint)]
      query: |
        DeviceProcessEvents
        | where Timestamp > ago({{lookback}})
        | where FileName in~ ("powershell.exe", "pwsh.exe")
        | where ProcessCommandLine contains "-enc"
        | project Timestamp, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine
    kql_sentinel:
      data_sources: [SecurityEvent table with Windows event 4688 and command line auditing on]
      query: |
        SecurityEvent
        | where TimeGenerated > ago({{lookback}})
        | where EventID == 4688
        | where NewProcessName endswith "\\powershell.exe" or NewProcessName endswith "\\pwsh.exe"
        | where CommandLine contains "-enc"
        | project TimeGenerated, Computer, SubjectUserName, NewProcessName, ParentProcessName, CommandLine
    spl:
      data_sources: [Endpoint data model Processes dataset (Splunk CIM 6.2)]
      query: |
        | tstats summariesonly=false count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where (Processes.process_name="powershell.exe" OR Processes.process_name="pwsh.exe") Processes.process="*-enc*" earliest=-{{lookback}} by Processes.dest Processes.user Processes.parent_process_name Processes.process_name Processes.process
    sigma:
      data_sources: [Process creation logs (Sysmon event 1 or Windows event 4688 with command line)]
      logsource: {category: process_creation, product: windows}
      detection:
        selection_image:
          Image|endswith: ['\powershell.exe', '\pwsh.exe']
        selection_command:
          CommandLine|contains: '-enc'
        condition: all of selection_*

  - id: web-server-child-shell
    title: Web server process starting a shell or recon tool
    techniques: [T1505.003, T1190]
    false_positives:
      - Some web applications start helper processes. Record the normal parent and child pairs before you alert.
      - These queries cover Windows web servers. Linux web servers need a separate hunt.
    kql_defender:
      data_sources: [DeviceProcessEvents table (Microsoft Defender for Endpoint)]
      query: |
        DeviceProcessEvents
        | where Timestamp > ago({{lookback}})
        | where InitiatingProcessFileName in~ ("w3wp.exe", "httpd.exe", "nginx.exe", "php-cgi.exe")
        | where FileName in~ ("cmd.exe", "powershell.exe", "pwsh.exe", "whoami.exe", "net.exe", "certutil.exe")
        | project Timestamp, DeviceName, InitiatingProcessFileName, FileName, ProcessCommandLine
    kql_sentinel:
      data_sources: [SecurityEvent table with Windows event 4688 and command line auditing on]
      query: |
        SecurityEvent
        | where TimeGenerated > ago({{lookback}})
        | where EventID == 4688
        | where ParentProcessName has_any ("w3wp.exe", "httpd.exe", "nginx.exe", "php-cgi.exe")
        | where NewProcessName has_any ("cmd.exe", "powershell.exe", "pwsh.exe", "whoami.exe", "net.exe", "certutil.exe")
        | project TimeGenerated, Computer, ParentProcessName, NewProcessName, CommandLine
    spl:
      data_sources: [Endpoint data model Processes dataset (Splunk CIM 6.2)]
      query: |
        | tstats summariesonly=false count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where (Processes.parent_process_name="w3wp.exe" OR Processes.parent_process_name="httpd.exe" OR Processes.parent_process_name="nginx.exe" OR Processes.parent_process_name="php-cgi.exe") (Processes.process_name="cmd.exe" OR Processes.process_name="powershell.exe" OR Processes.process_name="pwsh.exe" OR Processes.process_name="whoami.exe" OR Processes.process_name="net.exe" OR Processes.process_name="certutil.exe") earliest=-{{lookback}} by Processes.dest Processes.parent_process_name Processes.process_name Processes.process
    sigma:
      data_sources: [Process creation logs (Sysmon event 1 or Windows event 4688 with command line)]
      logsource: {category: process_creation, product: windows}
      detection:
        selection_parent:
          ParentImage|endswith: ['\w3wp.exe', '\httpd.exe', '\nginx.exe', '\php-cgi.exe']
        selection_child:
          Image|endswith: ['\cmd.exe', '\powershell.exe', '\pwsh.exe', '\whoami.exe', '\net.exe', '\certutil.exe']
        condition: all of selection_*

  - id: lsass-minidump-comsvcs
    title: LSASS memory dump through comsvcs.dll
    techniques: [T1003.001]
    false_positives:
      - Rare in normal use. Some crash diagnostic tools call MiniDump. Confirm the parent process.
    kql_defender:
      data_sources: [DeviceProcessEvents table (Microsoft Defender for Endpoint)]
      query: |
        DeviceProcessEvents
        | where Timestamp > ago({{lookback}})
        | where FileName =~ "rundll32.exe"
        | where ProcessCommandLine contains "comsvcs" and ProcessCommandLine contains "minidump"
        | project Timestamp, DeviceName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine
    kql_sentinel:
      data_sources: [SecurityEvent table with Windows event 4688 and command line auditing on]
      query: |
        SecurityEvent
        | where TimeGenerated > ago({{lookback}})
        | where EventID == 4688
        | where NewProcessName endswith "\\rundll32.exe"
        | where CommandLine contains "comsvcs" and CommandLine contains "minidump"
        | project TimeGenerated, Computer, SubjectUserName, ParentProcessName, CommandLine
    spl:
      data_sources: [Endpoint data model Processes dataset (Splunk CIM 6.2)]
      query: |
        | tstats summariesonly=false count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where Processes.process_name="rundll32.exe" Processes.process="*comsvcs*" Processes.process="*minidump*" earliest=-{{lookback}} by Processes.dest Processes.user Processes.parent_process_name Processes.process
    sigma:
      data_sources: [Process creation logs (Sysmon event 1 or Windows event 4688 with command line)]
      logsource: {category: process_creation, product: windows}
      detection:
        selection_image:
          Image|endswith: '\rundll32.exe'
        selection_dll:
          CommandLine|contains: 'comsvcs'
        selection_export:
          CommandLine|contains: 'minidump'
        condition: all of selection_*

  - id: schtasks-create
    title: Scheduled task created from the command line
    techniques: [T1053.005]
    false_positives:
      - Installers and updaters create scheduled tasks often. Baseline by parent process and task name.
    kql_defender:
      data_sources: [DeviceProcessEvents table (Microsoft Defender for Endpoint)]
      query: |
        DeviceProcessEvents
        | where Timestamp > ago({{lookback}})
        | where FileName =~ "schtasks.exe"
        | where ProcessCommandLine contains "/create"
        | project Timestamp, DeviceName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine
    kql_sentinel:
      data_sources: [SecurityEvent table with Windows event 4688 and command line auditing on]
      query: |
        SecurityEvent
        | where TimeGenerated > ago({{lookback}})
        | where EventID == 4688
        | where NewProcessName endswith "\\schtasks.exe"
        | where CommandLine contains "/create"
        | project TimeGenerated, Computer, SubjectUserName, ParentProcessName, CommandLine
    spl:
      data_sources: [Endpoint data model Processes dataset (Splunk CIM 6.2)]
      query: |
        | tstats summariesonly=false count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where Processes.process_name="schtasks.exe" Processes.process="*/create*" earliest=-{{lookback}} by Processes.dest Processes.user Processes.parent_process_name Processes.process
    sigma:
      data_sources: [Process creation logs (Sysmon event 1 or Windows event 4688 with command line)]
      logsource: {category: process_creation, product: windows}
      detection:
        selection_image:
          Image|endswith: '\schtasks.exe'
        selection_command:
          CommandLine|contains: '/create'
        condition: all of selection_*

  - id: lolbin-download
    title: certutil or bitsadmin downloading a file
    techniques: [T1105]
    false_positives:
      - Some administrators and software deployment scripts use bitsadmin to fetch files. Baseline by account and parent process.
    kql_defender:
      data_sources: [DeviceProcessEvents table (Microsoft Defender for Endpoint)]
      query: |
        DeviceProcessEvents
        | where Timestamp > ago({{lookback}})
        | where (FileName =~ "certutil.exe" and ProcessCommandLine contains "urlcache") or (FileName =~ "bitsadmin.exe" and ProcessCommandLine contains "/transfer")
        | project Timestamp, DeviceName, FileName, ProcessCommandLine, InitiatingProcessFileName
    kql_sentinel:
      data_sources: [SecurityEvent table with Windows event 4688 and command line auditing on]
      query: |
        SecurityEvent
        | where TimeGenerated > ago({{lookback}})
        | where EventID == 4688
        | where (NewProcessName endswith "\\certutil.exe" and CommandLine contains "urlcache") or (NewProcessName endswith "\\bitsadmin.exe" and CommandLine contains "/transfer")
        | project TimeGenerated, Computer, SubjectUserName, NewProcessName, CommandLine
    spl:
      data_sources: [Endpoint data model Processes dataset (Splunk CIM 6.2)]
      query: |
        | tstats summariesonly=false count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where ((Processes.process_name="certutil.exe" Processes.process="*urlcache*") OR (Processes.process_name="bitsadmin.exe" Processes.process="*/transfer*")) earliest=-{{lookback}} by Processes.dest Processes.user Processes.process_name Processes.process
    sigma:
      data_sources: [Process creation logs (Sysmon event 1 or Windows event 4688 with command line)]
      logsource: {category: process_creation, product: windows}
      detection:
        selection_certutil:
          Image|endswith: '\certutil.exe'
          CommandLine|contains: 'urlcache'
        selection_bitsadmin:
          Image|endswith: '\bitsadmin.exe'
          CommandLine|contains: '/transfer'
        condition: 1 of selection_*
