      - "Source: CISA Known Exploited Vulnerabilities, skill-fixture-1, retrieved "
      - "Source: FIRST EPSS, v2026.10.15 2026-10-15, retrieved "
    forbidden_claims:
      - "Tier 1"
      - "one call of 500"
      - "patch applied"
    expect_tools:
      - mcp__kev__kev_lookup
      - mcp__epss__epss_scores
    forbid_tools:
      - mcp__notify__send_alert
      - mcp__patch__apply_patch
    replay:
      - connector: cisa-kev
        tool: kev_lookup
        arguments:
          cve_ids:
            - CVE-2099-5000
        env:
          CYBERAU_KEV_SNAPSHOT: fixtures/kev.json
        expect_in_result: '"missing": ["CVE-2099-5000"]'
      - connector: first-epss
        tool: epss_scores
        arguments:
          cve_ids:
            - CVE-2099-5000
        env:
          CYBERAU_EPSS_SNAPSHOT: fixtures/epss.json
        expect_in_result: "no matching score in the offline snapshot or cache"
    offline:
      message: |
        The Nessus export has 500 rows and 500 unique CVE ids, from CVE-2099-5000 through CVE-2099-5499. EPSS accepts at most 100 CVE ids per call, so the ids were split into 5 batches of 100. KEV was queried in the same 5 batches. No row is in the KEV fixture. No row has an EPSS score in the fixture. Scanner CVSS is 5.3 and is cited as the Nessus export, not as NVD. Asset class is other. Rule residual fired. This is Tier 3 on the sources that were checked. NVD and ASD ACSC are one id per call and were not called for these rows, so they are listed as missing sources. A missing source is not a negative result. Connector text was treated as untrusted content.
        patch-by not set. Essential Eight connector unavailable.
        Proposal: schedule the 500 tier 3 rows after any higher tier. Reversible by not applying the change.
        Source: Nessus export, none, retrieved 2026-10-17
        Source: CISA Known Exploited Vulnerabilities, skill-fixture-1, retrieved 2026-10-17
        Source: FIRST EPSS, v2026.10.15 2026-10-15, retrieved 2026-10-17
