name: weekly-release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Diagnose image push for issue 295
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository }}:issue-295-${{ github.run_id }}"
          docker version
          docker build -f docker/Dockerfile -t "$image" .
          if push_log=$(docker push "$image" 2>&1); then
            printf '%s\n' "$push_log"
          else
            status=$?
            printf '%s\n' "$push_log" >&2
            exit "$status"
          fi
