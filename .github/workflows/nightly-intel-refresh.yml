# Check that the keyless public intel feeds (ASD ACSC, CISA KEV, FIRST EPSS, AusCERT and
# Feodo Tracker) still refresh live, and record each source's status in feeds/status.json.
# Live intel is not committed: every install refreshes into its own intel store, and a copy
# in git would go stale. A pull request opens only when a source's status changed.
# A required source that fails still records its status, then fails the run.
# ATT&CK, NVD, abuse.ch keyed feeds, OTX and Radar have no refresh adapter yet, so they are
# not listed here.
# 16:00 UTC is 03:00 AEDT and 02:00 AEST.
name: nightly-intel-refresh

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      open_pr: ${{ steps.intel.outputs.open_pr }}
      outcome: ${{ steps.intel.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv<1"
      - run: uv sync --project mcp --all-packages --frozen
      - name: Refresh the public sources live and record their status
        id: intel
        continue-on-error: true
        env:
          CYBERAU_DATA_DIR: ${{ runner.temp }}/cyberau
        run: >-
          uv run --project mcp python tools/ci/nightly_intel_refresh.py
          --sources asd,kev,epss,auscert,feodo
          --catalogue feeds/catalogue.yaml
          --summary PR_BODY.md
      - name: Check the refresh script
        run: uv run --project mcp pytest -q tests/snapshots --block-network
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.intel.outputs.open_pr == 'true'
        with:
          name: intel-refresh
          if-no-files-found: error
          path: |
            feeds/status.json
            PR_BODY.md

  pr:
    needs: refresh
    if: needs.refresh.outputs.open_pr == 'true'
    uses: ./.github/workflows/data-update-pr.yml
    with:
      artifact: intel-refresh
      branch_prefix: data/intel-refresh
      title: "Record public feed refresh status"
      body_file: PR_BODY.md
      allowed_paths: '^(feeds/status\.json|PR_BODY\.md|changed\.txt)$'
    secrets:
      DATA_PR_TOKEN: ${{ secrets.DATA_PR_TOKEN }}
    permissions:
      contents: write
      pull-requests: write

  refresh-failed:
    needs: refresh
    if: needs.refresh.outputs.outcome == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Fail the run when a required source did not refresh live
        run: |
          echo "::error title=Intel refresh failed::A required public source did not refresh live. See the refresh job log."
          exit 1
