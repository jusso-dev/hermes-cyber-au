servers:
  stub:
    connector: stub
    args:
    - serve
    - stub
    env: []
    trust: untrusted
    lazy: true
    timeout: 30
    enabled_by_default: true
    required_env: []
  kev:
    connector: cisa-kev
    args:
    - serve
    - cisa-kev
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  epss:
    connector: first-epss
    args:
    - serve
    - first-epss
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  ism:
    connector: asd-ism
    args:
    - serve
    - asd-ism
    env:
    - GITHUB_TOKEN=${GITHUB_TOKEN}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  asd:
    connector: asd-acsc
    args:
    - serve
    - asd-acsc
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  nvd:
    connector: nvd
    args:
    - serve
    - nvd
    env:
    - NVD_API_KEY=${NVD_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env:
    - NVD_API_KEY
  ghsa:
    connector: github-advisories
    wrap: true
    command: <PROFILE_HOME>/mcp/vendor/github-mcp-server/github-mcp-server
    args:
    - stdio
    - --toolsets
    - security_advisories
    - --read-only
    env:
    - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_ADVISORY_TOKEN}
    tools:
      include:
      - get_global_security_advisory
      - list_global_security_advisories
    trust: untrusted
    lazy: true
    timeout: 60
    enabled_by_default: true
    required_env:
    - GITHUB_ADVISORY_TOKEN
