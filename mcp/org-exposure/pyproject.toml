[project]
name = "cyberau-org-exposure"
version = "0.1.0"
description = "Query whether the user's own organisation is exposed, and alert once on new watchlist matches."
requires-python = ">=3.11"
dependencies = ["cyberau-common"]

[project.scripts]
cyberau = "cyberau_org_exposure.cli:main"

[tool.uv.sources]
cyberau-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberau_org_exposure"]
