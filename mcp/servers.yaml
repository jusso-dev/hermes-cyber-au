servers:
  stub:
    connector: stub
    args:
    - serve
    - stub
    env: []
    trust: untrusted
    lazy: true
    timeout: 30
    enabled_by_default: true
    required_env: []
  kev:
    connector: cisa-kev
    args:
    - serve
    - cisa-kev
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  epss:
    connector: first-epss
    args:
    - serve
    - first-epss
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  ism:
    connector: asd-ism
    args:
    - serve
    - asd-ism
    env:
    - GITHUB_TOKEN=${GITHUB_TOKEN}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  asd:
    connector: asd-acsc
    args:
    - serve
    - asd-acsc
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  nvd:
    connector: nvd
    args:
    - serve
    - nvd
    env:
    - NVD_API_KEY=${NVD_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env:
    - NVD_API_KEY
  hudsonrock:
    connector: hudson-rock
    args:
    - serve
    - hudson-rock
    env:
    - HUDSONROCK_API_KEY=${HUDSONROCK_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    default_enabled: false
    paid: true
    required_env:
    - HUDSONROCK_API_KEY
  spycloud:
    connector: spycloud
    args:
    - serve
    - spycloud
    env:
    - SPYCLOUD_API_KEY=${SPYCLOUD_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    default_enabled: false
    paid: true
    required_env:
    - SPYCLOUD_API_KEY
  upguard:
    connector: upguard
    args:
    - serve
    - upguard
    env:
    - UPGUARD_API_KEY=${UPGUARD_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    default_enabled: false
    paid: true
    required_env:
    - UPGUARD_API_KEY
  ransomlive:
    connector: ransomware-live
    args:
    - serve
    - ransomware-live
    env:
    - RANSOMWARE_LIVE_API_KEY=${RANSOMWARE_LIVE_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    default_enabled: false
    paid: false
    required_env: []
  recordedfuture:
    connector: recorded-future
    args:
    - serve
    - recorded-future
    env:
    - RECORDED_FUTURE_API_TOKEN=${RECORDED_FUTURE_API_TOKEN}
    - RECORDED_FUTURE_ORG_ID=${RECORDED_FUTURE_ORG_ID}
    - RECORDED_FUTURE_MCP_CLIENT_ID=${RECORDED_FUTURE_MCP_CLIENT_ID}
    - RECORDED_FUTURE_MCP_CLIENT_SECRET=${RECORDED_FUTURE_MCP_CLIENT_SECRET}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    default_enabled: false
    paid: true
    required_env:
    - RECORDED_FUTURE_API_TOKEN
  flashpoint:
    connector: flashpoint
    args:
    - serve
    - flashpoint
    env:
    - FLASHPOINT_API_TOKEN=${FLASHPOINT_API_TOKEN}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    default_enabled: false
    paid: true
    required_env:
    - FLASHPOINT_API_TOKEN
  intel471:
    connector: intel471
    args:
    - serve
    - intel471
    env:
    - INTEL471_EMAIL=${INTEL471_EMAIL}
    - INTEL471_API_KEY=${INTEL471_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    default_enabled: false
    paid: true
    required_env:
    - INTEL471_EMAIL
    - INTEL471_API_KEY
  gtidtm:
    connector: google-ti-dtm
    args:
    - serve
    - google-ti-dtm
    env:
    - GTI_API_KEY=${GTI_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    default_enabled: false
    paid: true
    required_env:
    - GTI_API_KEY
  csrecon:
    connector: crowdstrike-recon
    args:
    - serve
    - crowdstrike-recon
    env:
    - FALCON_CLIENT_ID=${FALCON_CLIENT_ID}
    - FALCON_CLIENT_SECRET=${FALCON_CLIENT_SECRET}
    - FALCON_BASE_URL=${FALCON_BASE_URL}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    default_enabled: false
    paid: true
    required_env:
    - FALCON_CLIENT_ID
    - FALCON_CLIENT_SECRET
  socradar:
    connector: socradar
    args:
    - serve
    - socradar
    env:
    - SOCRADAR_API_KEY=${SOCRADAR_API_KEY}
    - SOCRADAR_COMPANY_ID=${SOCRADAR_COMPANY_ID}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    default_enabled: false
    paid: true
    required_env:
    - SOCRADAR_API_KEY
    - SOCRADAR_COMPANY_ID
  darkowl:
    connector: darkowl
    args:
    - serve
    - darkowl
    env:
    - DARKOWL_PUBLIC_KEY=${DARKOWL_PUBLIC_KEY}
    - DARKOWL_PRIVATE_KEY=${DARKOWL_PRIVATE_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    default_enabled: false
    paid: true
    required_env:
    - DARKOWL_PUBLIC_KEY
    - DARKOWL_PRIVATE_KEY
  flare:
    connector: flare
    args:
    - serve
    - flare
    env:
    - FLARE_API_KEY=${FLARE_API_KEY}
    - FLARE_TENANT_ID=${FLARE_TENANT_ID}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    default_enabled: false
    paid: true
    required_env:
    - FLARE_API_KEY
  flare_mcp:
    connector: flare-mcp
    url: https://api.flare.io/mcp
    args: []
    env:
    - FLARE_API_KEY=${FLARE_API_KEY}
    - FLARE_TENANT_ID=${FLARE_TENANT_ID}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    default_enabled: false
    tools:
      include:
      - search_tenant
      - search_global
      - search_validate_search_query
      - events_get_event
      - events_expand_event
      - events_get_event_type
      - identifiers_list
      - identifiers_explain_event
      - identifier_groups_list
      - matching_policies_list
      - severity_rules_list
      - entities_search
      - profile_get
    headers:
    - Authorization=${FLARE_API_KEY}
    - X-Flare-Tenant-Id=${FLARE_TENANT_ID}
