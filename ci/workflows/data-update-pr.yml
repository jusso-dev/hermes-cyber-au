# Proposed: .github/workflows/data-update-pr.yml
# Reusable workflow. Callers regenerate data into the working tree, upload it as an artifact,
# and this workflow commits it to a dated branch and opens or updates one pull request.
# It never pushes to main.
# Justin copies this file into .github/workflows/ by hand. The token for this repo
# cannot push files under .github/workflows/.
# The script is copied to RUNNER_TEMP before the artifact download so the artifact
# cannot replace the checks that decide what gets committed.
name: data-update-pr

on:
  workflow_call:
    inputs:
      artifact:
        description: Artifact holding the changed files (paths relative to repo root)
        required: true
        type: string
      branch_prefix:
        required: true
        type: string
      title:
        required: true
        type: string
      body_file:
        description: Path inside the artifact to a Markdown PR body
        required: true
        type: string
      labels:
        required: false
        type: string
        default: "type:task,area:ci"
      allowed_paths:
        description: Extended regex of paths the caller may change
        required: false
        type: string
        default: '^(mcp/[a-z0-9-]+/data/|feeds/|intel/snapshots/|skills/[a-z0-9-]+/references/|PR_BODY\.md$)'
    secrets:
      DATA_PR_TOKEN:
        description: Optional fine-grained token or GitHub App token so the PR triggers CI. Falls back to GITHUB_TOKEN.
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.DATA_PR_TOKEN || github.token }}

      - name: Keep the data-update script outside the artifact
        run: |
          set -euo pipefail
          cp tools/ci/data_update_pr.py "$RUNNER_TEMP/data_update_pr.py"
          test -s "$RUNNER_TEMP/data_update_pr.py"

      - name: Download the data artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact }}
          path: .

      - name: Refuse unexpected paths
        env:
          ALLOWED_PATHS: ${{ inputs.allowed_paths }}
        run: python3 "$RUNNER_TEMP/data_update_pr.py" refuse

      - name: Commit, push and open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.DATA_PR_TOKEN || github.token }}
          BRANCH_PREFIX: ${{ inputs.branch_prefix }}
          TITLE: ${{ inputs.title }}
          BODY_FILE: ${{ inputs.body_file }}
          LABELS: ${{ inputs.labels }}
          ALLOWED_PATHS: ${{ inputs.allowed_paths }}
        run: python3 "$RUNNER_TEMP/data_update_pr.py" open
