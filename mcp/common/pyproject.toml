[project]
name = "cyberau-common"
version = "0.1.0"
description = "Shared HTTP, egress, cache, and MCP server library for hermes-cyber-au connectors."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "idna>=3,<4",
  "jsonschema>=4,<5",
  "mcp>=1.2,<3",
  "pyyaml>=6,<7",
  "zstandard>=0.23,<1",
]
authors = [{ name = "Justin Middler" }]

[project.scripts]
cyberau-mcp = "cyberau_common.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberau_common"]
