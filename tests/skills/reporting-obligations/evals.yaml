      \ A person lodges it.\n  Deadline report: 72 hours from payment, due 2026-03-05T11:00:00+11:00\n\
      \    Basis: Within 72 hours of making the ransomware payment or of becoming aware that it was made,\
      \ whichever applies (Cyber Security Act 2024 (Cth) s 27(1)).\n  Question: What was the organisation's\
      \ annual turnover for the previous financial year? The Rules set the threshold at AUD 3 million.\n\
      \  Citation: Cyber Security Act 2024 (Cth) s 27(1). Link: https://www.legislation.gov.au/C2024A00098/latest/text\n\
      \  Source: Ransomware payment report, aureg snapshot 2026-11-28, retrieved 2026-11-28\n  DRAFT.\
      \ Not submitted. Draft fields:\n    Reporting entity ABN (if any) and address: Example University\n\
      \    If another entity paid on your behalf: its ABN (if any) and address: (to complete)\n    Time\
      \ the incident occurred, actual or estimated: (to complete)\n    Time the entity became aware of\
      \ the incident: 2026-03-01T16:00:00+11:00\n    Impact on the entity's infrastructure: (to complete)\n\
      \    Impact on the entity's customers: (to complete)\n    Ransomware or other malware variants:\
      \ (to complete)\n    Vulnerabilities exploited: (to complete)\n    Information that may help a Commonwealth\
      \ or State body respond: (to complete)\n    Amount demanded, or a description of a non-monetary\
      \ demand: (to complete)\n    Payment method demanded: (to complete)\n    Amount paid, or a description\
      \ of a non-monetary payment: (to complete)\n    Payment method used: (to complete)\n    Nature and\
      \ timing of communications with the extorting entity: (to complete)\n    Brief description of those\
      \ communications: (to complete)\n    Brief description of pre-payment negotiations: (to complete)\n\
      \nLimited use notes:\n- Limited use of information in a ransomware payment report. Citation: Cyber\
      \ Security Act 2024 (Cth) ss 29 to 32. Link: https://www.legislation.gov.au/C2024A00098/latest/text\n\
      \  Information in a ransomware payment report may be recorded, used or disclosed only for the permitted\
      \ purposes in s 29(1). The designated Commonwealth body must not use it to investigate or enforce\
      \ a contravention by the entity of a Commonwealth, State or Territory law, other than Part 3 itself\
      \ or a criminal offence (s 29(2)). Secondary recipients are bound the same way (s 30). Giving the\
      \ report does not otherwise affect a claim of legal professional privilege (s 31). The report is\
      \ generally not admissible in evidence against the entity (s 32). These limits do not cover information\
      \ already given to meet SOCI Part 2B or the Telecommunications Act, or information already lawfully\
      \ public (s 29(4)).\n- ASD's limited use obligation for voluntarily shared information. Citation:\
      \ Intelligence Services Act 2001 (Cth) Part 6 Division 1A, as described by ASD. Link: https://www.cyber.gov.au/guidance/how-asd-protects-your-privacy-limited-use-obligation\n\
      \  Information an organisation voluntarily gives ASD about a cyber security incident cannot be used\
      \ by ASD for regulatory purposes, and ASD staff cannot be compelled to give it in most proceedings.\
      \ The protection does not expire, but it stops applying to information the organisation makes lawfully\
      \ public. It does not satisfy any mandatory reporting obligation, and it does not stop regulators\
      \ or police using their own powers to obtain information.\n\nDoes not apply on these facts:\n- Notifiable\
      \ Data Breaches: assess a suspected eligible data breach: no: personal information was, or may have\
      \ been, accessed, disclosed or lost\n  Watch for: If personal information turns out to be involved,\
      \ start the 30 day assessment clock from the time the organisation became aware of the suspicion.\n\
      - Notifiable Data Breaches: statement to the Commissioner and notice to individuals: no: personal\
      \ information was, or may have been, accessed, disclosed or lost\n  Watch for: If the assessment\
      \ finds reasonable grounds to believe an eligible data breach happened, the statement is due as\
      \ soon as practicable.\n- SOCI Act: critical cyber security incident report: no: org.yaml marks\
      \ the organisation as critical infrastructure; no: org.yaml lists SOCI as a regulatory regime; no:\
      \ the affected asset is covered by SOCI Part 2B\n  Watch for: The 12 hour clock starts when the\
      \ entity becomes aware of a significant impact on availability.\n- SOCI Act: other cyber security\
      \ incident report: no: org.yaml marks the organisation as critical infrastructure; no: org.yaml\
      \ lists SOCI as a regulatory regime; no: the affected asset is covered by SOCI Part 2B\n- APRA CPS\
      \ 234: material information security incident: no: org.yaml lists APRA as a regulator; no: the organisation\
      \ is an APRA-regulated entity\n- APRA CPS 234: material control weakness that cannot be fixed in\
      \ time: no: org.yaml lists APRA as a regulator; no: the organisation is an APRA-regulated entity\n\
      - Voluntary information to the National Cyber Security Coordinator (significant incident): no: the\
