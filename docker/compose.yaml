# Agent plus an optional gateway. Keys come from an env file beside this
# compose file. That file is not part of the image.
#
# By default compose builds the image from this checkout and tags it
# hermes-cyber-au:local. To run a published release instead, set
# CYBERAU_IMAGE to a release tag, which uses CalVer (YYYY.MM.DD):
#   CYBERAU_IMAGE=ghcr.io/jusso-dev/hermes-cyber-au:2026.10.24 \
#     docker compose -f docker/compose.yaml run --rm agent
name: hermes-cyber-au

x-hermes: &hermes
  image: ${CYBERAU_IMAGE:-hermes-cyber-au:local}
  build:
    context: ..
    dockerfile: docker/Dockerfile
  environment:
    HERMES_PROFILE: cyber-au
  env_file:
    - path: .env
      required: false
  volumes:
    - cyberau:/opt/data

services:
  agent:
    <<: *hermes
    stdin_open: true
    tty: true
    command: ["chat"]

  gateway:
    <<: *hermes
    profiles: ["gateway"]
    command: ["-p", "cyber-au", "gateway", "run"]
    ports:
      - "127.0.0.1:8642:8642"

volumes:
  cyberau:
    name: cyberau
