[project]
name = "cyberau-hudson-rock"
version = "0.1.0"
description = "Read-only Hudson Rock Cavalier connector for infostealer exposure counts."
requires-python = ">=3.11"
dependencies = ["cyberau-common", "cyberau-premium"]

[tool.uv.sources]
cyberau-common = { workspace = true }
cyberau-premium = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberau_hudson_rock"]
