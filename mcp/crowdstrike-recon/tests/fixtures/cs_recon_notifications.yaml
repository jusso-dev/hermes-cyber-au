interactions:
- request:
    method: POST
    uri: https://api.crowdstrike.com/oauth2/token
    headers:
      Authorization: [REDACTED]
  response:
    status:
      code: 401
      message: Unauthorized
    headers:
      Content-Type:
      - application/json
    body:
      string: '{"errors":[{"code":401,"message":"access denied, invalid bearer token"}]}'
version: 1
