# Model and provider stay unset. The person who installs this profile chooses them.
timezone: Australia/Sydney
security:
  allow_private_urls: false
  redact_secrets: true
mcp_servers: {}
# Local intel store. Vacuum folds observations older than retention_days into
# indicator counters. Advisories are kept.
cyber_au:
  store:
    retention_days: 365
