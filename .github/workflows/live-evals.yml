# Weekly live-model skill evals with a published scorecard (issue #164).
# Runs tests/skills/harness.py --live inside the pinned Hermes image against the models in
# the CYBERAU_EVAL_MODELS repository variable (or the dispatch input), with the provider key
# from the OPENROUTER_API_KEY repository secret. Connectors stay offline; only the model call
# is live. Without the secret or a model list the run skips with a notice and does nothing.
# Writes one markdown scorecard per skill as an artifact, opens a data pull request for
# docs/skills/scorecard.md (never merged automatically), and opens or comments on one
# "Live eval regression" issue when a skill falls below its threshold in
# tests/skills/eval-thresholds.yaml. GitHub-hosted runners only.
# 18:00 UTC Sunday is 05:00 AEDT and 04:00 AEST on Monday.
name: live-evals

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated model ids. Overrides the CYBERAU_EVAL_MODELS variable.
        required: false
        type: string
        default: ""
      force_regression:
        description: A skill id to fail on purpose, to check the regression issue path.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: live-evals
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      models: ${{ steps.gate.outputs.models }}
    steps:
      - name: Skip cleanly without the key or a model list
        id: gate
        env:
          HAS_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
          INPUT_MODELS: ${{ inputs.models }}
          VAR_MODELS: ${{ vars.CYBERAU_EVAL_MODELS }}
        run: |
          models="${INPUT_MODELS:-$VAR_MODELS}"
          if [ "$HAS_KEY" != "true" ]; then
            printf '%s\n' "::notice title=Live evals skipped::The OPENROUTER_API_KEY repository secret is not set. See docs/skills/live-evals.md."
            printf 'run=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$models" ]; then
            printf '%s\n' "::notice title=Live evals skipped::No models. Set the CYBERAU_EVAL_MODELS repository variable or the models input."
            printf 'run=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$models" | grep -Eq '^[A-Za-z0-9._:/@+-]+(,[A-Za-z0-9._:/@+-]+)*$'; then
            printf '%s\n' "::error title=Live evals::Model ids may only use letters, digits and . _ : / @ + -, separated by commas."
            exit 1
          fi
          printf 'run=true\nmodels=%s\n' "$models" >> "$GITHUB_OUTPUT"

  evals:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      scored: ${{ steps.score.outputs.scored }}
      regression: ${{ steps.score.outputs.regression }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv<1"
      - run: uv sync --project mcp --all-packages --frozen
      - name: Read the pinned Hermes image
        run: printf 'HERMES_IMAGE=%s\n' "$(python3 tools/hermes_pin.py image)" >> "$GITHUB_ENV"
      - name: Run the live evals inside the Hermes image
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CYBERAU_EVAL_MODELS: ${{ needs.gate.outputs.models }}
          HERMES_INFERENCE_PROVIDER: openrouter
        run: |
          docker run --rm -v "$PWD:/src" \
            -e OPENROUTER_API_KEY -e CYBERAU_EVAL_MODELS -e HERMES_INFERENCE_PROVIDER \
            --entrypoint bash "$HERMES_IMAGE" -lc 'bash /src/tools/ci/live_evals.sh'
      - name: Score each skill against its threshold
        id: score
        env:
          FORCE_REGRESSION: ${{ inputs.force_regression }}
        run: >-
          uv run --project mcp python tools/ci/eval_scorecard.py score
          --results-dir eval-out
          --thresholds tests/skills/eval-thresholds.yaml
          --out-dir scorecards
          --summary docs/skills/scorecard.md
          --pr-body PR_BODY.md
          --issue-body ISSUE_BODY.md
          --force-regression "$FORCE_REGRESSION"
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-eval-scorecards
          if-no-files-found: error
          path: scorecards/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-eval-summary
          if-no-files-found: error
          path: |
            docs/skills/scorecard.md
            PR_BODY.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.score.outputs.regression == 'true'
        with:
          name: live-eval-issue
          if-no-files-found: error
          path: ISSUE_BODY.md

  pr:
    needs: evals
    if: needs.evals.outputs.scored == 'true'
    uses: ./.github/workflows/data-update-pr.yml
    with:
      artifact: live-eval-summary
      branch_prefix: data/live-evals
      title: "Record the weekly live eval scorecard"
      body_file: PR_BODY.md
      labels: "type:task,area:skills"
      allowed_paths: '^(docs/skills/scorecard\.md|PR_BODY\.md)$'
    secrets:
      DATA_PR_TOKEN: ${{ secrets.DATA_PR_TOKEN }}
    permissions:
      contents: write
      pull-requests: write

  regression:
    needs: evals
    if: needs.evals.outputs.regression == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the issue text outside the checkout
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: live-eval-issue
          path: ${{ runner.temp }}/live-eval-issue
      - name: Open or update the regression issue
        env:
          GH_TOKEN: ${{ github.token }}
          BODY_FILE: ${{ runner.temp }}/live-eval-issue/ISSUE_BODY.md
        run: python3 tools/ci/eval_scorecard.py issue --body-file "$BODY_FILE"
