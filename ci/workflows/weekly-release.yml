# Proposed: .github/workflows/weekly-release.yml
# Weekly release packaging: CalVer tag, release notes, distribution tarball, SBOM,
# checksums, and a Docker image pushed to GHCR. Friday 23:00 UTC is Saturday 10:00 AEDT.
name: weekly-release

on:
  schedule:
    - cron: "0 23 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "uv<1"
      - name: Skip if nothing changed since the last tag
        id: changes
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$last" ] && [ -z "$(git log "$last"..HEAD --oneline)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compute version
        if: steps.changes.outputs.skip != 'true'
        id: ver
        run: echo "version=$(TZ=Australia/Sydney date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
      - name: Build distribution tarball, SBOM and checksums
        if: steps.changes.outputs.skip != 'true'
        run: |
          uv run --project mcp --frozen python tools/release/package.py --version "${{ steps.ver.outputs.version }}" --out dist/
          sha256sum dist/* > dist/SHA256SUMS
      # Attest the tarball, SBOM, notes and checksums this job has written.
      - name: Attest release files
        uses: actions/attest-build-provenance@v2
        if: steps.changes.outputs.skip != 'true'
        with:
          subject-path: dist/*
      - name: Build and push image
        id: image
        if: steps.changes.outputs.skip != 'true' && inputs.dry_run != true && hashFiles('docker/Dockerfile') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}"
          docker build -f docker/Dockerfile -t "$image" .
          push_log=$(docker push "$image" 2>&1)
          printf '%s\n' "$push_log"
          digest=$(printf '%s\n' "$push_log" | sed -n 's/.*digest: \(sha256:[0-9a-f]*\).*/\1/p' | tail -n 1)
          if [ -z "$digest" ]; then
            echo "image push did not return a digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"
      # Attest the image only after the push returns its registry digest.
      - name: Attest image
        if: steps.changes.outputs.skip != 'true' && inputs.dry_run != true && hashFiles('docker/Dockerfile') != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Tag and publish release
        if: steps.changes.outputs.skip != 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ steps.ver.outputs.version }}"
          gh release create "$v" dist/* --title "$v" --notes-file dist/RELEASE_NOTES.md --target "${{ github.sha }}"
