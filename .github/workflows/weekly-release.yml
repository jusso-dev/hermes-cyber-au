name: weekly-release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Remove disposable package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE users/jusso-dev/packages/container/hermes-cyber-au-issue-295
      - name: Inspect temporary version removal options
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import base64, json, os, urllib.request, urllib.error
          basic = base64.b64encode(("${{ github.actor }}:" + os.environ["GH_TOKEN"]).encode()).decode()
          request = urllib.request.Request("https://ghcr.io/token?service=ghcr.io&scope=repository:jusso-dev/hermes-cyber-au:pull,push,delete", headers={"Authorization": "Basic " + basic})
          token = json.load(urllib.request.urlopen(request))["token"]
          request = urllib.request.Request("https://ghcr.io/v2/jusso-dev/hermes-cyber-au/manifests/issue-295-43656525625", method="DELETE", headers={"Authorization": "Bearer " + token})
          try:
              with urllib.request.urlopen(request) as response:
                  print("Remove temporary tag:", response.status)
          except urllib.error.HTTPError as error:
              print("Remove temporary tag:", error.code, error.read().decode())
          PYTHON
