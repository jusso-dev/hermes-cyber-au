servers:
  stub:
    connector: stub
    args:
    - serve
    - stub
    env: []
    trust: untrusted
    lazy: true
    timeout: 30
    enabled_by_default: true
    required_env: []
  kev:
    connector: cisa-kev
    args:
    - serve
    - cisa-kev
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  epss:
    connector: first-epss
    args:
    - serve
    - first-epss
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  ism:
    connector: asd-ism
    args:
    - serve
    - asd-ism
    env:
    - GITHUB_TOKEN=${GITHUB_TOKEN}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  asd:
    connector: asd-acsc
    args:
    - serve
    - asd-acsc
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  nvd:
    connector: nvd
    args:
    - serve
    - nvd
    env:
    - NVD_API_KEY=${NVD_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env:
    - NVD_API_KEY
  blueprint:
    connector: asd-blueprint
    args:
    - serve
    - asd-blueprint
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  datagov:
    connector: datagov-au
    args:
    - serve
    - datagov-au
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  abusech:
    connector: abusech
    args:
    - serve
    - abusech
    env:
    - ABUSECH_AUTH_KEY=${ABUSECH_AUTH_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    default_enabled: false
    off_reason: licence terms
    terms_doc: docs/connectors/abusech.md
    required_env:
    - ABUSECH_AUTH_KEY
  abuseipdb:
    connector: abuseipdb
    args:
    - serve
    - abuseipdb
    env:
    - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env:
    - ABUSEIPDB_API_KEY
  otx:
    connector: otx
    args:
    - serve
    - otx
    env:
    - OTX_API_KEY=${OTX_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env:
    - OTX_API_KEY
  aureg:
    connector: au-regulatory
    args:
    - serve
    - au-regulatory
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  auscert:
    connector: auscert
    args:
    - serve
    - auscert
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  cloudflare_radar:
    connector: cloudflare-radar
    kind: wrap
    url: https://mcp.cloudflare.com/mcp?codemode=false
    auth: oauth
    token_env: CLOUDFLARE_RADAR_API_TOKEN
    tools:
      include:
      - '*_radar_*'
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    required_env: []
    docs: docs/connectors/cloudflare-radar.md
  cfscan:
    connector: cloudflare-urlscanner
    args:
    - serve
    - cloudflare-urlscanner
    env:
    - CLOUDFLARE_URLSCAN_API_TOKEN=${CLOUDFLARE_URLSCAN_API_TOKEN}
    - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
    trust: untrusted
    lazy: true
    timeout: 120
    supports_parallel_tool_calls: true
    enabled_by_default: false
    default_enabled: false
    required_env:
    - CLOUDFLARE_URLSCAN_API_TOKEN
    - CLOUDFLARE_ACCOUNT_ID
  crtsh:
    connector: crtsh
    args:
    - serve
    - crtsh
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  ghsa:
    connector: github-advisories
    wrap: true
    command: <PROFILE_HOME>/mcp/vendor/github-mcp-server/github-mcp-server
    args:
    - stdio
    - --toolsets
    - security_advisories
    - --read-only
    - --exclude-tools
    - list_repository_security_advisories,list_org_repository_security_advisories
    env:
    - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_ADVISORY_TOKEN}
    tools:
      include:
      - get_global_security_advisory
      - list_global_security_advisories
    trust: untrusted
    lazy: true
    timeout: 60
    enabled_by_default: true
    required_env:
    - GITHUB_ADVISORY_TOKEN
  greynoise:
    connector: greynoise
    args:
    - serve
    - greynoise
    env:
    - GREYNOISE_API_KEY=${GREYNOISE_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
