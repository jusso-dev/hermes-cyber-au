[project]
name = "cyberau-workspace"
version = "0.1.0"
description = "Workspace for hermes-cyber-au MCP connectors."
requires-python = ">=3.11"
dependencies = ["cyberau-common", "cyberau-premium", "cyberau-crowdstrike-recon"]

[project.optional-dependencies]
# Optional DuckDB export: uv sync --project mcp --extra analytics
analytics = ["duckdb>=1.1,<3"]

[tool.uv.workspace]
members = ["common", "cisa-kev", "first-epss", "nvd", "asd-acsc", "asd-ism", "asd-essentials", "datagov-au", "org-exposure", "abusech", "abuseipdb", "otx", "asd-blueprint", "au-regulatory", "auscert", "cloudflare-radar", "cloudflare-urlscanner", "custom-feeds", "crtsh", "github-advisories", "greynoise", "hibp", "irap", "misp", "mitre-attack", "ncsc-nz", "opencti", "openphish", "osv", "phishtank", "pspf", "ransomware-live", "scamwatch", "shodan-internetdb", "sigma", "spamhaus-drop", "taxii-ctis", "threatsieve", "hindsight", "premium", "crowdstrike-recon", "darkowl", "flare", "flashpoint", "google-ti-dtm", "hudson-rock", "intel471", "recorded-future", "socradar", "spycloud", "upguard", "cve-program"]

[tool.uv.sources]
cyberau-common = { workspace = true }
cyberau-premium = { workspace = true }
cyberau-crowdstrike-recon = { workspace = true }

[dependency-groups]
dev = [
  "cyclonedx-bom>=7.3.0,<8",
  "hypothesis>=6,<7",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<8",
  "pytest-recording>=0.13,<0.15",
  "ruff>=0.8,<1",
  "stix2-validator>=3.3.1,<4",
]

[tool.pytest.ini_options]
testpaths = [
  "common/tests",
  "../tests",
  "asd-acsc/tests",
  "asd-ism/tests",
  "asd-essentials/tests",
  "cisa-kev/tests",
  "cve-program/tests",
  "first-epss/tests",
  "nvd/tests",
  "cloudflare-radar/tests",
  "datagov-au/tests",
  "org-exposure/tests",
  "abusech/tests",
  "abuseipdb/tests",
  "otx/tests",
  "asd-blueprint/tests",
  "au-regulatory/tests",
  "auscert/tests",
  "cloudflare-urlscanner/tests",
  "custom-feeds/tests",
  "crtsh/tests",
  "github-advisories/tests",
  "greynoise/tests",
  "hibp/tests",
  "irap/tests",
  "misp/tests",
  "mitre-attack/tests",
  "ncsc-nz/tests",
  "opencti/tests",
  "openphish/tests",
  "osv/tests",
  "phishtank/tests",
  "pspf/tests",
  "ransomware-live/tests",
  "scamwatch/tests",
  "shodan-internetdb/tests",
  "sigma/tests",
  "spamhaus-drop/tests",
  "taxii-ctis/tests",
  "threatsieve/tests",
  "virustotal/tests",
  "hindsight/tests",
  "darkowl/tests",
  "premium/tests",
  "crowdstrike-recon/tests",
  "flare/tests",
  "flashpoint/tests",
  "google-ti-dtm/tests",
  "hudson-rock/tests",
  "intel471/tests",
  "recorded-future/tests",
  "socradar/tests",
  "spycloud/tests",
  "upguard/tests",
]
pythonpath = [
  "../plugins/cyber-au",
  "common/src",
  "asd-acsc/src",
  "asd-essentials/src",
  "asd-ism/src",
  "cisa-kev/src",
  "first-epss/src",
  "nvd/src",
  "darkowl/src",
  "premium/src",
  "crowdstrike-recon/src",
  "flare/src",
  "flashpoint/src",
  "google-ti-dtm/src",
  "hudson-rock/src",
  "intel471/src",
  "recorded-future/src",
  "socradar/src",
  "spycloud/src",
  "upguard/src",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
source = ["cyberau_common"]
branch = false
