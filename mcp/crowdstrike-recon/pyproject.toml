[project]
name = "cyberau-crowdstrike-recon"
version = "0.1.0"
description = "Read-only CrowdStrike Falcon Adversary Intelligence Recon connector."
requires-python = ">=3.11"
dependencies = [
  "cyberau-common",
  "cyberau-premium",
  "crowdstrike-falconpy>=1.5,<2",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
]

[tool.uv.sources]
cyberau-common = { workspace = true }
cyberau-premium = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberau_crowdstrike_recon"]
