[project]
name = "cyberau-sigma"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cyberau-common",
  "pysigma>=1.5.1,<2",
  "pysigma-backend-elasticsearch>=2.1.1,<3",
  "pysigma-backend-kusto>=1.0.1,<2",
  "pysigma-backend-splunk>=2.1.0,<3",
]

[tool.uv.sources]
cyberau-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberau_sigma"]
