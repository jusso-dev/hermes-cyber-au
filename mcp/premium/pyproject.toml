[project]
name = "cyberau-premium"
version = "0.1.0"
description = "Shared interface for paid, bring-your-own-licence connectors."
requires-python = ">=3.11"
dependencies = [
  "cyberau-common",
  "pydantic>=2,<3",
  "pyyaml>=6,<7",
]

[tool.uv.sources]
cyberau-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberau_premium"]
