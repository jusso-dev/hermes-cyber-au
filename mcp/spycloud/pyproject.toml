[project]
name = "cyberau-spycloud"
version = "0.1.0"
description = "Read-only SpyCloud Enterprise Protection connector. Bring your own licence."
requires-python = ">=3.11"
dependencies = [
  "cyberau-common",
  "cyberau-premium",
  "pyyaml>=6,<7",
]

[tool.uv.sources]
cyberau-common = { workspace = true }
cyberau-premium = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberau_spycloud"]
