      \    Brief description of those communications: (to complete)\n    Brief description of pre-payment\
      \ negotiations: (to complete)\n- Voluntary report to ASD's ACSC (ReportCyber) (voluntary)\n  Recipient:\
      \ ASD's Australian Cyber Security Centre.\n  Channel: ReportCyber on cyber.gov.au, or the Australian\
      \ Cyber Security Hotline 1300 CYBER1 (1300 292 371), 24 hours a day. A person reports.\n  Deadline\
      \ report: as soon as practicable from discovery, due no fixed time\n    Basis: As soon as possible\
      \ after becoming aware. ASD guidance, not a statutory deadline.\n  Citation: ASD, Report a cyber\
      \ security incident. Link: https://www.cyber.gov.au/report-a-cyber-security-incident\n  Source:\
      \ Voluntary report to ASD's ACSC (ReportCyber), aureg snapshot 2026-11-28, retrieved 2026-11-28\n\
      \  DRAFT. Not submitted. Draft fields:\n    Organisation name: Example Retail Pty Ltd\n    Contact\
      \ person: (to complete)\n    When the incident was discovered: 2026-10-02T09:00:00+10:00\n    What\
      \ happened: Ransomware encrypted file servers and a payment was made\n    Systems affected: (to\
      \ complete)\n    Indicators of compromise, defanged: (to complete)\n\nMay apply:\n- Notifiable Data\
      \ Breaches: statement to the Commissioner and notice to individuals (mandatory)\n  Recipient: Office\
      \ of the Australian Information Commissioner (statement), then the individuals concerned or at risk\
      \ (notice).\n  Channel: The OAIC notifiable data breach form, then notice to individuals. A person\
      \ lodges and sends them.\n  Deadline commissioner_statement: as soon as practicable from awareness\
      \ of reasonable grounds to believe there was an eligible data breach, due no fixed time\n    Basis:\
      \ As soon as practicable after awareness of reasonable grounds to believe there has been an eligible\
      \ data breach. No fixed hour count (Privacy Act 1988 (Cth) s 26WK(2)).\n  Deadline individual_notice:\
      \ as soon as practicable from preparing the statement to the Commissioner, due no fixed time\n \
      \   Basis: As soon as practicable after the statement is prepared, not from the original awareness\
      \ time (Privacy Act 1988 (Cth) s 26WL(3)).\n  Question: Are there reasonable grounds to believe\
      \ there has been an eligible data breach (serious harm is likely and remedial action has not prevented\
      \ it)?\n  Citation: Privacy Act 1988 (Cth) ss 26WK(2) and 26WL(3). Link: https://www.legislation.gov.au/C2004A03712/latest/text\n\
      \  Source: Notifiable Data Breaches: statement to the Commissioner and notice to individuals, aureg\
      \ snapshot 2026-11-28, retrieved 2026-11-28\n  DRAFT. Not submitted. Draft fields:\n    Identity\
      \ and contact details of the entity: Example Retail Pty Ltd\n    Description of the eligible data\
      \ breach: Ransomware encrypted file servers and a payment was made\n    Kind or kinds of information\
      \ concerned: (to complete)\n    Recommended steps individuals should take in response: (to complete)\n\
      \nLimited use notes:\n- Limited use of information in a ransomware payment report. Citation: Cyber\
      \ Security Act 2024 (Cth) ss 29 to 32. Link: https://www.legislation.gov.au/C2024A00098/latest/text\n\
      \  Information in a ransomware payment report may be recorded, used or disclosed only for the permitted\
      \ purposes in s 29(1). The designated Commonwealth body must not use it to investigate or enforce\
      \ a contravention by the entity of a Commonwealth, State or Territory law, other than Part 3 itself\
      \ or a criminal offence (s 29(2)). Secondary recipients are bound the same way (s 30). Giving the\
      \ report does not otherwise affect a claim of legal professional privilege (s 31). The report is\
      \ generally not admissible in evidence against the entity (s 32). These limits do not cover information\
      \ already given to meet SOCI Part 2B or the Telecommunications Act, or information already lawfully\
      \ public (s 29(4)).\n- ASD's limited use obligation for voluntarily shared information. Citation:\
      \ Intelligence Services Act 2001 (Cth) Part 6 Division 1A, as described by ASD. Link: https://www.cyber.gov.au/guidance/how-asd-protects-your-privacy-limited-use-obligation\n\
      \  Information an organisation voluntarily gives ASD about a cyber security incident cannot be used\
      \ by ASD for regulatory purposes, and ASD staff cannot be compelled to give it in most proceedings.\
      \ The protection does not expire, but it stops applying to information the organisation makes lawfully\
      \ public. It does not satisfy any mandatory reporting obligation, and it does not stop regulators\
      \ or police using their own powers to obtain information.\n\nDoes not apply on these facts:\n- SOCI\
      \ Act: critical cyber security incident report: no: org.yaml marks the organisation as critical\
      \ infrastructure; no: org.yaml lists SOCI as a regulatory regime; no: the affected asset is covered\
      \ by SOCI Part 2B\n  Watch for: The 12 hour clock starts when the entity becomes aware of a significant\
      \ impact on availability.\n- SOCI Act: other cyber security incident report: no: org.yaml marks\
      \ the organisation as critical infrastructure; no: org.yaml lists SOCI as a regulatory regime; no:\
      \ the affected asset is covered by SOCI Part 2B\n- APRA CPS 234: material information security incident:\
      \ no: org.yaml lists APRA as a regulator; no: the organisation is an APRA-regulated entity\n- APRA\
      \ CPS 234: material control weakness that cannot be fixed in time: no: org.yaml lists APRA as a\
      \ regulator; no: the organisation is an APRA-regulated entity\n- Voluntary information to the National\
      \ Cyber Security Coordinator (significant incident): no: the incident is, or could reasonably be\
      \ expected to be, a significant cyber security incident (s 34)\n  Watch for: If the incident could\
      \ seriously prejudice Australia's social or economic stability, defence or national security, or\
      \ is of serious concern to the Australian people (s 34), the organisation may share information\
      \ with the National Cyber Security Coordinator under s 35.\n\nProposal: the incident lead lodges\
      \ the Notifiable Data Breaches: assess a suspected eligible data breach before 2026-11-01T09:00:00+11:00,\
      \ after review.\nProposal: the incident lead lodges the Ransomware payment report before 2026-10-06T13:00:00+11:00,\
      \ after review.\nProposal: a person decides whether to make the voluntary ASD report. This skill\
      \ does not submit, send or lodge anything.\n\nQuestions to settle the rules that may apply:\n- Are\
      \ there reasonable grounds to believe there has been an eligible data breach (serious harm is likely\
      \ and remedial action has not prevented it)?\n\nGet legal advice where the answer turns on a judgement.\
      \ Source: Australian reporting obligations snapshot, 2026-11-28, retrieved 2026-11-28\n"
