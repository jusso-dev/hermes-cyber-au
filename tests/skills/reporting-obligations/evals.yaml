    servers at 2026-10-02T09:00:00+10:00. The board approved a payment and it was made at 2026-10-03T12:00:00+10:00.
    Customer names and addresses may have been taken. What do we have to report, to whom and by when?
    It is now 2026-10-04T09:00:00+11:00.
  required_facts:
