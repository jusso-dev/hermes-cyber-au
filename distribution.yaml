name: cyber-au
version: 0.1.0
description: "Hermes Agent distribution for Australian cyber security teams: ASD guidance, AU and global threat intel, triage and reporting skills."
hermes_requires: ">=0.22.2"
author: "Justin Middler"
license: "Apache-2.0"
distribution_owned:
  - distribution.yaml
  - SOUL.md
  - config.yaml
  - .env.template
  - skills
  - cron/jobs.json
  - scripts
  - plugins/cyber-au
  - mcp
  - feeds
  - playbooks
env_requires:
  - name: ABUSECH_AUTH_KEY
    description: "abuse.ch Auth-Key (free at https://auth.abuse.ch/). Needed for URLhaus, ThreatFox, MalwareBazaar."
    required: false
  - name: NVD_API_KEY
    description: "Optional NVD API key. Raises NVD limits from 5 to 50 requests per 30 seconds."
    required: false
  - name: OTX_API_KEY
    description: "AlienVault OTX API key."
    required: false
  - name: CLOUDFLARE_RADAR_API_TOKEN
    description: "Cloudflare custom token with Account > Radar > Read only."
    required: false
  - name: GREYNOISE_API_KEY
    description: "Optional GreyNoise community key."
    required: false
  - name: GITHUB_TOKEN
    description: "Optional GitHub token. Raises the GitHub API limit from 60 to 5,000 requests an hour for the ISM connector."
    required: false
  - name: ABR_GUID
    description: "Optional ABN Lookup web services GUID. Expands watchlist ABNs to registered names. The ABN is not sent to vendors."
    required: false
  - name: ABUSEIPDB_API_KEY
    description: "AbuseIPDB API key. Needed for IP and network reputation checks."
    required: false
  - name: OPENCTI_URL
    description: "OpenCTI instance URL. Used only when you enable the opencti connector."
    required: false
  - name: OPENCTI_TOKEN
    description: "API token for a read-only OpenCTI user. The connector stays off until enabled in config.yaml."
    required: false
  - name: TAXII_API_ROOT
    description: "TAXII 2.1 API root for a server you supply, including ASD CTIS after onboarding. Off by default."
    required: false
  - name: TAXII_COLLECTION_ID
    description: "TAXII collection id for TAXII_API_ROOT. Off by default."
    required: false
  - name: TAXII_USERNAME
    description: "HTTP Basic username for TAXII_API_ROOT. Off by default."
    required: false
  - name: TAXII_PASSWORD
    description: "HTTP Basic password for TAXII_API_ROOT. Off by default. Never commit a value."
    required: false
  - name: THREATSIEVE_URL
    description: "Optional ThreatSieve origin. Defaults to http://127.0.0.1:8787 when unset."
    required: false
  - name: THREATSIEVE_API_KEY
    description: "Optional ThreatSieve scoped API key for POST /v1/assess."
    required: false
