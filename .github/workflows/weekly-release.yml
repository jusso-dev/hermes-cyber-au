name: weekly-release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Diagnose image push for issue 295
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository }}-issue-295:${{ github.run_id }}"
          docker version
          docker build -f docker/Dockerfile -t "$image" .
          if push_log=$(docker push "$image" 2>&1); then
            printf '%s\n' "$push_log"
          else
            status=$?
            printf '%s\n' "$push_log" >&2
            exit "$status"
          fi
      - name: Remove disposable issue 295 images
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json
          import subprocess
          def api(*args):
              return subprocess.check_output(["gh", "api", *args], text=True)
          base = "users/jusso-dev/packages/container/"
          original = base + "hermes-cyber-au"
          disposable = {
              "sha256:0b99ed39f4ff0a805bec40003199338d5ca464d8c766744f132015ca4bf2f09b",
              "sha256:98853d41b54beae337fa4014df001bcba2b990bd9be85e9d6d0dc65fd65423a8",
              "sha256:1369288af2b2c684f0d7ff6f0ede7ff71568692f3113fec478f5ae6400a7cf44",
          }
          versions = json.loads(api(original + "/versions?per_page=100"))
          for version in versions:
              if version["name"] in disposable:
                  api("--method", "DELETE", original + "/versions/" + str(version["id"]))
                  print("Removed diagnostic version", version["name"])
          api("--method", "DELETE", base + "hermes-cyber-au-issue-295")
          print("Removed disposable package hermes-cyber-au-issue-295")
          PYTHON
