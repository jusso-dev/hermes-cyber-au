[project]
name = "cyberau-google-ti-dtm"
version = "0.1.0"
description = "Read-only Google Threat Intelligence Digital Threat Monitoring connector."
requires-python = ">=3.11"
dependencies = [
  "cyberau-common",
  "cyberau-premium",
  "jsonschema>=4,<5",
  "pyyaml>=6,<7",
]

[tool.uv.sources]
cyberau-common = { workspace = true }
cyberau-premium = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberau_google_ti_dtm"]
