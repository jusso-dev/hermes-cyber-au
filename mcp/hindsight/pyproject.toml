[project]
name = "cyberau-hindsight"
version = "0.1.0"
description = "Hindsight retain and recall client, plus the local handoff queue."
requires-python = ">=3.11"
dependencies = ["cyberau-common"]

[tool.uv.sources]
cyberau-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberau_hindsight"]
