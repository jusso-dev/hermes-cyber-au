name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Legacy pack tests
        if: hashFiles('pyproject.toml') != ''
        run: |
          pip install -e .
          python -m unittest discover -s tests -v
          python -m hermes_cyber_au eval
      - name: Connector reference and workspace tests
        if: hashFiles('mcp/pyproject.toml') != ''
        run: |
          python -m pip install "uv<1"
          uv sync --project mcp --all-packages --frozen
          uv run --project mcp python tools/build_connector_docs.py --check
          uv run --project mcp pytest -q --block-network
      - name: Planning tree hygiene
        if: hashFiles('pyproject.toml') == '' && hashFiles('mcp/pyproject.toml') == ''
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          tickets = list(Path("tickets").glob("*.md"))
          if len(tickets) < 100:
              raise SystemExit(f"expected the ticket plan, found {len(tickets)} files")
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          banned_names = {".env", "auth.json", "credentials.json"}
          bad = [path for path in tracked if Path(path).name in banned_names or path.endswith(".pem") or path.endswith(".key")]
          if bad:
              raise SystemExit("tracked secret-like files: " + ", ".join(bad))
          print(f"planning tree ok: {len(tickets)} tickets, {len(tracked)} tracked files")
          PY
          if [ -d tests ] && find tests -name 'test_*.py' | grep -q .; then
            python3 -m unittest discover -s tests -v
          fi
