      This is a draft prepared with hermes-cyber-au from the information supplied and the sources cited. It is not an IRAP assessment, not an authorisation to operate, not a PSPF compliance finding and not legal advice. Each rating is for the risk steward to confirm. Nothing was sent and no one was notified.

