        Element 1: loss of personal information on an unencrypted laptop that has not been recovered or remotely deleted. Later access is likely. The records cover 40 customers.
        Source: OAIC Notifiable Data Breaches scheme, none, retrieved 2026-10-17
        Element 2: serious financial harm is more probable than not from the name, date of birth and customer account number.
