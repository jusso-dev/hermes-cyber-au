servers:
  stub:
    connector: stub
    args:
    - serve
    - stub
    env: []
    trust: untrusted
    lazy: true
    timeout: 30
    enabled_by_default: true
    required_env: []
  kev:
    connector: cisa-kev
    args:
    - serve
    - cisa-kev
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  epss:
    connector: first-epss
    args:
    - serve
    - first-epss
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  ism:
    connector: asd-ism
    args:
    - serve
    - asd-ism
    env:
    - GITHUB_TOKEN=${GITHUB_TOKEN}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  asd:
    connector: asd-acsc
    args:
    - serve
    - asd-acsc
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  blueprint:
    connector: asd-blueprint
    args:
    - serve
    - asd-blueprint
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  nvd:
    connector: nvd
    args:
    - serve
    - nvd
    env:
    - NVD_API_KEY=${NVD_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env:
    - NVD_API_KEY
  datagov:
    connector: datagov-au
    args:
    - serve
    - datagov-au
    env: []
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env: []
  abusech:
    connector: abusech
    args:
    - serve
    - abusech
    env:
    - ABUSECH_AUTH_KEY=${ABUSECH_AUTH_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: false
    default_enabled: false
    off_reason: licence terms
    terms_doc: docs/connectors/abusech.md
    required_env:
    - ABUSECH_AUTH_KEY
  abuseipdb:
    connector: abuseipdb
    args:
    - serve
    - abuseipdb
    env:
    - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env:
    - ABUSEIPDB_API_KEY
  otx:
    connector: otx
    args:
    - serve
    - otx
    env:
    - OTX_API_KEY=${OTX_API_KEY}
    trust: untrusted
    lazy: true
    timeout: 120
    enabled_by_default: true
    required_env:
    - OTX_API_KEY
