# Per-connector hosts for hermes-cyber-au. Kept in step with the connector
# inventory. tools/ci/check_allowlist.py fails if the two drift.
# global_deny_cidrs is a floor. Removing a network from this list fails CI,
# and the code keeps refusing that network even if the list is shorter.
version: 1
global_deny_cidrs:
  - 0.0.0.0/8
  - 10.0.0.0/8
  - 100.64.0.0/10
  - 127.0.0.0/8
  - 169.254.0.0/16
  - 172.16.0.0/12
  - 192.0.0.0/24
  - 192.0.2.0/24
  - 192.168.0.0/16
  - 198.18.0.0/15
  - 198.51.100.0/24
  - 203.0.113.0/24
  - 224.0.0.0/4
  - 240.0.0.0/4
  - 255.255.255.255/32
  - "::/128"
  - "::1/128"
  - "::ffff:0:0/96"
  - "64:ff9b::/96"
  - "64:ff9b:1::/48"
  - "2001:db8::/32"
  - "2002::/16"
  - "fc00::/7"
  - "fe80::/10"
  - "fec0::/10"
  - "ff00::/8"
