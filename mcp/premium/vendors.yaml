# Conservative terms and quota defaults for premium feeds.
# Licence values are never stored here. Names only.
vendors:
  hudsonrock:
    package: hudson-rock
    name: Hudson Rock Cavalier (infostealer exposure by domain)
    paid: true
    milestone: v1.0
    licence_env:
      - HUDSONROCK_API_KEY
    terms:
      cache: session
      cache_ttl_max_s: 0
      store: metadata
      stix_export: false
      share_outside_profile: false
      redistribution: forbidden
      attribution: Commercial licence. Session cache only. Store counts and metadata only. No STIX export. No sharing outside the profile.
    quota:
      calls_per_day: null
      calls_per_month: null
      cost_units_per_call: 1.0
      monthly_budget_units: null
      approval_above_units: null
      hard_stop: true
    routine_share: 0.5
    max_pages: 5
    tool_prefixes:
